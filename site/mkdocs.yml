site_name: dspy4s
site_description: "A Scala 3 library for building composable language model programs."
site_author: jpablo
site_url: https://jpablo.github.io/dspy4s/

repo_url: https://github.com/jpablo/dspy4s
repo_name: jpablo/dspy4s
edit_uri: edit/main/site/docs/

# Build output goes into the repo's already-gitignored target/ dir.
docs_dir: docs
site_dir: ../target/site

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
    - toc.follow
  font:
    text: Inter
    code: JetBrains Mono

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  # Material icon / emoji shortcodes (:material-shield-check:) → inline SVG.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # Snippets can include compiler-checked examples when a guide needs a large sample.
  - pymdownx.snippets:
      base_path:
        - ..
        - ../modules/examples/src/main/scala/dspy4s/examples
      check_paths: true
      dedent_subsections: true

# The nav follows the functional API in learning order.
nav:
  - Home: index.md
  - Get Started:
      - Installation: get-started/installation.md
      - Quickstart: get-started/quickstart.md
      - How it fits together: get-started/overview.md
  - Programs:
      - Signatures: programs/signatures.md
      - Composing programs: programs/composing.md
      - Strategies and tools: programs/strategies.md
  - Evaluation: evaluation/index.md
  - Optimization: optimization/index.md
  - Effects and events: runtime/effects-and-events.md
  - Coming from DSPy: coming-from-dspy.md
  - API map: reference/api.md
