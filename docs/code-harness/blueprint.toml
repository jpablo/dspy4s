[[node]]
id = "harness-effects"
group = "harness-effects"
kind = "data"
name = "HarnessEffects"
ops = ["callPolicy", "runCell"]
ref = "4.6"
uses = ["turn-effects", "predict", "policy-input", "policy-step", "context-strategy", "journal-trait", "scala-repl",
        "recorder", "snapshot-store", "harness-limits", "runtime-context", "session-state", "budget", "host-threads",
        "policy-runner", "zoom-source", "memory-progress", "drafts"]
proof_uses = ["cell-result", "policy-reply", "window", "recorder", "snapshot-store", "lost-names", "budget",
              "host-threads", "zoom-source", "memory-progress", "policy-stream"]
text = "callPolicy projects the log with the strategy, spends one call of the budget, and calls the policy leaf through the PolicyRunner, so the trace reaches the RuntimeContext. A spent budget fails the call, and the turn ends Failed. runCell starts the calls of the cell, takes the snapshot of the store, runs the code in the REPL, and joins the trace of the host threads. After the error of the compiler defect, it starts a new REPL and adds the note of the lost names. With drafts, the call to the policy streams its draft through a PolicyStream, and the step does not change. Each call to the policy has the options of the model of the session in the state of the journal, so a ModelChanged of the activation applies to the next call, and the progress gets the tokens of its last model call (CLI_SCREEN.md, 14.4)."

