[[node]]
id = "editor-console"
group = "console"
kind = "data"
name = "EditorConsole"
ops = ["read", "print", "printRows", "onInterrupt", "watch", "onDetail", "close"]
ref = "10.6"
uses = ["console", "typed", "reasoning-view", "model-facts"]
text = "The line editor of JLine for a person at a terminal: line edit, and a history file with the mask of the secrets. Enter after an odd number of backslashes goes on to the next line, and a paste stays as it is. Ctrl-C on a line with text clears it, and a Ctrl-C outside a read runs the action of the client. During a turn, a timer redraws the line through a widget: a spinner, the time, the label of what runs and the activity of the host, and a blinking block cursor. close first ends a read that waits, so the terminal gets its modes and its cursor back. Tab after /effort completes the levels of the model."

[[group]]
id = "cli"
phase = "p7"
module = "harness-cli"
file = "Cli.scala"
title = "The terminal client"

[[node]]
id = "cli"
group = "cli"
kind = "data"
name = "Cli"
ops = ["main", "loop", "listText", "deskStep"]
ref = "15"
uses = ["session-handle", "console", "desk", "host-desk", "screen", "model-facts", "effort"]
proof_uses = ["cli-args", "local-host", "work-runtime", "work-env", "entry-text", "parse-line", "commands-for", "plain-console", "editor-console", "stop-notice", "jobs-text", "status-text", "job-starts", "pending-calls", "sessions-text", "resolve-session", "card-text", "open-refusal", "plan-text", "host-error", "screen", "effort", "model-facts"]
text = "main makes the model from the environment, makes the console, starts a LocalHost with a WorkRuntime, and opens the session. --list prints the sessions and opens none. loop prints the feed, and each text goes through printable. It sends a message, /stop and /stopall, and it runs /close, /allow and /stopjob so the person sees a refusal. Each error of the host prints in words (HostError.words). A Ctrl-C during a turn is /stop, and the stop notice follows a turn that a stop ended. With a desk, /sessions, /open, /reopen, /controller and /close go to deskStep (8.7). A proposal: JDK 21. A rich console gets the rows of Screen for each entry, and the live block and the footer of the session that it shows. A new session gets the effort of Effort.startOptions, a daemon thread reads the facts of the model, and /effort prints the effort or sends ChangeModel (CLI_SCREEN.md, 14.4)."

# ── Phase 7: the laws ─────────────────────────────────────────────────────────────────────────────────────────────

[[group]]
id = "guarded-laws"
phase = "p7"
module = "harness"
file = "GuardedLaws.scala"
where = "tests"
title = "The laws of guarded"

[[node]]
id = "law-guarded"
group = "guarded-laws"
kind = "law"
name = "Guarded:"
ref = "5.5"
uses = ["guarded", "recorder"]
text = "Allow runs, and Deny stops with an error. Ask with no grant stops with NeedsApproval of the Exact rule, and Ask with a grant runs. With no person, Ask gives a plain error. The recorder calls guarded after the commit of EffectStarted: a Deny call does not run, and an Ask call puts its rule in pending."

[[group]]
id = "chat-window-laws"
phase = "p7"
module = "harness"
file = "ChatWindowLaws.scala"
where = "tests"
title = "The laws of the window for a chat"

[[node]]
id = "law-chat-window"
group = "chat-window-laws"
kind = "law"
name = "Chat window:"
ref = "7"
spec = true
uses = ["window"]
text = "A step sees each earlier turn as its message and its reply, oldest first, and the message of the open turn. An earlier turn with no reply shows the text of its report, with no Scala value. With a small budget, the oldest turns go first. One open turn has no earlier turn."

[[group]]
id = "link-laws"
phase = "p7"
module = "harness"
file = "LinkLaws.scala"
where = "tests"
title = "The laws of the link from a child to its parent"

[[node]]
id = "law-link"
group = "link-laws"
kind = "law"
name = "Link:"
ref = "8.2"
spec = true
uses = ["harness", "harness-env", "source"]
text = "The task of an rlm child has the source Parent with the id of the parent session and the id of its rlm effect. env.journals gets a different id for each session of a call."

[[group]]
id = "session-file-laws"
phase = "p7"
module = "harness-host"
file = "SessionFileLaws.scala"
where = "tests"
title = "The laws of the file of a session"

[[node]]
id = "law-file"
group = "session-file-laws"
kind = "law"
name = "File:"
ref = "10.2"
uses = ["session-file"]
text = "The rows come back in the order of seq, also after a new open. A commit with a seq that the file has adds nothing. WAL and synchronous NORMAL stay after a flush. A copy holds the same journal only for its session. A row that does not decode is skipped when it is not required, and lastSeq counts it. A file that is not a journal gives an error."

[[group]]
id = "writer-laws"
phase = "p7"
module = "harness-host"
file = "WriterLaws.scala"
where = "tests"
title = "The laws of the writer and of the timers"

[[node]]
id = "law-writer"
group = "writer-laws"
kind = "law"
name = "Writer:"
ref = "10.2"
uses = ["writer", "writer-journal"]
text = "The commits of several threads have no gap in seq, and the state is the fold of the file. run returns after the rows are in the file. An interrupt does not cut a commit. After close, each command fails at once. A failed write ends only its session. A fenced ticket gets Fenced. expire closes a stopped turn and does nothing to a later one. The file holds no known secret."

[[node]]
id = "law-timer"
group = "writer-laws"
kind = "law"
name = "Timer:"
ref = "10.2"
uses = ["timers", "writer"]
text = "A timer runs once after its delay, a cancel stops it, and a timer commits only through the writer."

[[group]]
id = "feed-laws"
phase = "p7"
module = "harness-host"
file = "FeedLaws.scala"
where = "tests"
title = "The laws of the feeds"

[[node]]
id = "law-feed"
group = "feed-laws"
kind = "law"
name = "Feed:"
ref = "10.2"
uses = ["feeds", "writer"]
text = "A client gets the entries after its subscribe in the order of seq, and before run returns. A full queue gives Behind, and publish does not wait. A client that reads the journal on Behind misses no entry and gets none twice. After the end, the queue drains and ended is true."

[[group]]
id = "catalog-laws"
phase = "p7"
module = "harness-host"
file = "CatalogLaws.scala"
where = "tests"
title = "The laws of the catalog"

[[node]]
id = "law-catalog"
group = "catalog-laws"
kind = "law"
name = "Catalog:"
ref = "10.2"
uses = ["catalog", "catalog-row-fold", "session-file"]
text = "The row is a fold of the journal, with the folder, the time of the last entry and the first message. The first message keeps whole characters, also for a long text. A row of an earlier catalog is folded again. A new open reads the same rows. rebuild folds each journal whose row lags or is ahead, and it puts a bad file into failed."

[[group]]
id = "host-laws"
phase = "p7"
module = "harness-host"
file = "HostLaws.scala"
where = "tests"
title = "The laws of the host and of a hard stop, with scripted effects"

[[node]]
id = "law-host"
group = "host-laws"
kind = "law"
name = "Host:"
ref = "10.2"
uses = ["local-host", "host-error"]
text = "open makes the file and commits Activated, and a second open gives the same handle. A new id with no configuration, a mode above the ceiling, a session of another host and a bad file give OpenFailed. A reopen keeps the configuration of the journal, also after Close. A message starts a turn that a worker runs. An open after a crash repairs the turn. The store comes back in a new host. run gives a refusal. list gives the rows. words gives each error of the host in words, and a refusal in the words of the kernel."

[[node]]
id = "law-hard-stop"
group = "host-laws"
kind = "law"
name = "Hard stop:"
ref = "10.3"
uses = ["local-host"]
text = "Abort commits StopRequested, stops the activation, and the turn ends Aborted. A cell that does not end in the grace period: the activation is fenced, the writer closes the turn, a late commit of that activation does not reach the next turn, and the next turn gets a new activation. The grace timer of a stop does not touch a later turn."

[[group]]
id = "job-laws"
phase = "p7"
module = "harness-host"
file = "JobLaws.scala"
where = "tests"
title = "The laws of the job table and of the wrapper, with real processes"

[[node]]
id = "law-jobs"
group = "job-laws"
kind = "law"
name = "Jobs:"
ref = "10.3"
uses = ["job-table", "process-wrapper"]
text = "A job outlives its call, with its output and its exit code. A stop mark stops a job, with KILL after the grace period, and sync returns at once. A marked job does not start. A job with no row is Lost. The end of a job with report reaches the report of the table. close stops each job."

[[group]]
id = "work-laws"
phase = "p7"
module = "harness-host"
file = "WorkLaws.scala"
where = "tests"
title = "The laws of a work session, with a real REPL, the sandbox and a scripted model"

[[node]]
id = "law-work"
group = "work-laws"
kind = "law"
name = "Work:"
ref = "8.1"
uses = ["work-runtime", "local-host"]
text = "config and workMode, with no Sessions^ and no Children^, and defaultGuard. A cell runs in the scope, a val stays for the next turn, and rlm does not compile. Each turn gets a new budget. An Ask call does not run, pending holds its rule, and a Grant lets the new turn run it. A catch does not hide it. Under the sandbox a job runs on after its cell, Abort during a cell stops no job, and StopJobs(OfLastTurn) stops it. A report starts a turn. stopJob stops the job. jobStatus gives Running for a job that runs, and Stopped after StopJobs. A stop ends a long exec and its process. A stop during a long policy call ends the call, the turn ends Aborted before the grace period, and the REPL stays. The handle gives the summaries of the memory while they run, and memoryUse after the first policy call. The handle gives the draft of the policy while the model writes it, and none after the turn or after a stop, also when the thread of the cut call goes on."

[[group]]
id = "crash-laws"
phase = "p7"
module = "harness-host"
file = "CrashLaws.scala"
where = "tests"
title = "The laws of a crash of the host, with a host in a child JVM"

[[node]]
id = "law-crash"
group = "crash-laws"
kind = "law"
name = "Crash:"
ref = "10.3"
uses = ["local-host", "work-runtime", "catalog-row-fold"]
text = "After a SIGKILL of the host during a cell, no process of a job or of an exec stays, the next start gives the catalog rows of the journals, and the open gives TurnEnded(Crashed)."

[[group]]
id = "cli-laws"
phase = "p7"
module = "harness-cli"
file = "CliLaws.scala"
where = "tests"
title = "The laws of the CLI, and the check of its start time"

[[node]]
id = "law-cli"
group = "cli-laws"
kind = "law"
name = "CLI:"
ref = "10.3"
uses = ["cli-args", "parse-line", "commands-for", "entry-text", "pending-calls", "job-order", "job-starts", "jobs-text", "stop-notice", "status-text", "sessions-text", "resolve-session", "plain-console", "in-quotes", "job-name"]
text = "parse and parseLine read the commands, and a bad number or name is not a command. Each command gives its commands, and the lines of the client give none. A pending call keeps its number. The views name each job and quote each command, so no control character reaches the terminal. The list gives the newest session first, and the start of an id finds one journal. loop prints the views and the stop notice, and Ctrl-C sends Abort. The live block of a rich console shows the draft of the handle."

[[node]]
id = "check-cli-start"
group = "cli-laws"
kind = "check"
name = "CLI start:"
ref = "15"
uses = ["cli"]
text = "The time from the start of a JVM to the end at /quit, in a child JVM. Choice 8: an AOT cache on JDK 25 comes only if this time is too long."

[[group]]
id = "console-laws"
phase = "p7"
module = "harness-cli"
file = "ConsoleLaws.scala"
where = "tests"
title = "The laws of the line editor"

[[group]]
id = "effort-laws"
phase = "p7"
module = "harness-cli"
file = "EffortLaws.scala"
where = "tests"
title = "The laws of the effort and of the context in the footer (CLI_SCREEN.md, 14)"

[[node]]
id = "law-effort"
group = "effort-laws"
kind = "law"
name = "Effort:"
ref = "10.6"
uses = ["effort"]
text = "A new session takes DSPY_REASONING_EFFORT, else low with native reasoning, else no effort. of reads the effort of a model, and set changes only the effort."

[[node]]
id = "law-facts"
group = "effort-laws"
kind = "law"
name = "Facts:"
ref = "10.6"
uses = ["model-facts"]
text = "parse reads the window and the levels of the entry of the model, also with the prefix of an owner and from max_model_len. A model that is not in the list and a bad text give no facts. DSPY_CONTEXT_WINDOW wins over the endpoint. The levels of /effort are none and the levels of the endpoint."

[[node]]
id = "law-footer"
group = "effort-laws"
kind = "law"
name = "Footer:"
ref = "10.6"
uses = ["screen", "context-use", "model-facts"]
text = "The footer gives the effort, the context with its window and percent, and the memory in characters. With no window the context is its count, under 1% the percent is <1%, and a count shows as 18k, 1M or 1.6M. A footer wider than the terminal shows no memory part."

[[node]]
id = "law-effort-command"
group = "effort-laws"
kind = "law"
name = "/effort:"
ref = "10.6"
uses = ["line", "commands-for", "effort", "entry-text", "screen", "cli"]
text = "parseLine reads /effort with no level and with one level. A level of the list gives ChangeModel with the level and the other options of the model, and another level gives an error with the list. /effort alone prints the effort and the levels. A ModelChanged shows the new effort, and the loop sends ChangeModel for a level."

[[node]]
id = "law-status-effort"
group = "effort-laws"
kind = "law"
name = "/status:"
ref = "10.6"
uses = ["status-text", "context-use", "model-facts"]
text = "/status gives the effort and the context of the model, and a session with no effort and no context gives neither."

[[group]]
id = "screen-laws"
phase = "p7"
module = "harness-cli"
file = "ScreenLaws.scala"
where = "tests"
title = "The laws of the screen of the line editor"

[[node]]
id = "law-screen"
group = "screen-laws"
kind = "law"
name = "Screen:"
ref = "10.6"
uses = ["screen", "activity"]
text = "A finished step prints its reasoning line, its text and the summary of its cell, and the reply prints in full. The summary names what the calls did, and each failed cell has its own words. The full detail prints the code, each call with its result, and the output. An approval prints its card, and the end of a turn names each outcome. A command shows each hidden character as an escape. The live block gives the status line, the memory summaries and the open cell. A step with no Acted shows its draft: the reasoning in the view of /reasoning, then the last lines of its text, and a step with its Acted shows no draft. The footer hides a part with no value, /show gives a cell or a call, and the ASCII glyphs give no other character."

[[node]]
id = "law-cli-editor"
group = "console-laws"
kind = "law"
name = "CLI editor:"
ref = "10.6"
uses = ["editor-console"]
text = "An odd number of backslashes goes on, an even number does not, and a paste keeps each backslash. A ! stays. The history keeps each line after the mask. Ctrl-C on an empty line gives Interrupt, on a line with text clears it, and outside a read runs the action of the client. close ends a read that waits, and it turns bracketed paste off. A live block taller than the window shows its last rows above one rule and the prompt, and no copy goes into the scrollback."

[[group]]
id = "policy-runner"
phase = "p7"
module = "harness"
file = "PolicyRunner.scala"
title = "How the effects of a harness run the LM call of the policy"

[[node]]
id = "policy-runner"
group = "policy-runner"
kind = "data"
name = "PolicyRunner"
ops = ["run"]
ref = "10.3"
uses = []
text = "A program call runs the LM call of the policy on the thread of callPolicy. A work session runs it on a thread of its own, so a hard stop cuts a long call and the turn ends Aborted. The update of the derived data stays on the thread of callPolicy."

[[group]]
id = "process-wrapper"
phase = "p7"
module = "harness-sandbox"
file = "ProcessWrapper.scala"
title = "The wrapper of each exec and each job, which a crash of the host stops"

[[node]]
id = "process-wrapper"
group = "process-wrapper"
kind = "data"
name = "ProcessWrapper"
ops = ["command"]
ref = "10.3"
spec = true
uses = []
text = "The command that runs a command in its own process group with an empty standard input. When the standard input of the wrapper closes, the wrapper stops the group, so no process of it starts a new process, reads the tree of the command from ps, and gives TERM to the group and the tree, then KILL after the grace period. The tree holds the sandbox of bwrap, which is in another session. The wrapper ends after the stop. The host holds the pipe, so a crash of the host stops the command."

[[group]]
id = "wrapper-laws"
phase = "p7"
module = "harness-sandbox"
file = "WrapperLaws.scala"
where = "tests"
title = "The laws of the wrapper of a process"

[[node]]
id = "law-wrapper"
group = "wrapper-laws"
kind = "law"
name = "Wrapper:"
ref = "10.3"
uses = ["process-wrapper"]
text = "The wrapper gives the exit code of its command, and the command gets an empty standard input. When the pipe closes, the wrapper stops the process group, with KILL after the grace period for a command that ignores TERM. A process that ignores TERM gets KILL also when the first process of the group ended on TERM, and the stop reaches a process of the command in another session."

[[group]]
id = "shell-stop-laws"
phase = "p7"
module = "harness-sandbox"
file = "ShellStopLaws.scala"
where = "tests"
title = "The laws of the stop of an exec"

[[node]]
id = "law-shell-stop"
group = "shell-stop-laws"
kind = "law"
name = "Shell stop:"
ref = "10.3"
uses = ["sandboxed-shell"]
text = "stopAll ends an exec that runs, its process tree stops, and the exec gives a note of the stop. An interrupt of the thread of an exec stops its process tree, and the exec gives the interrupt back to its thread."

[[group]]
id = "stop-cell-laws"
phase = "p7"
module = "harness-repl"
file = "StopCellLaws.scala"
where = "tests"
title = "The laws of the stop of one cell"

[[node]]
id = "law-stop-cell"
group = "stop-cell-laws"
kind = "law"
name = "Stop cell:"
ref = "10.3"
uses = ["scala-repl"]
text = "stopCell ends the running cell with a failure, and the REPL keeps the definitions of the earlier cells. With no running cell it does nothing. A cell that starts while the turn stops also ends with a failure, and the next turn runs cells. A guest call that the stop interrupts leaves no stack trace in the output."

# ── Phase 8: the memory tree (7.1) ──────────────────────────────────────────────────────────────────────────────────

[[group]]
id = "memory"
phase = "p8"
module = "harness"
file = "Memory.scala"
title = "The memory algebra: the messages, the nodes, the lines, the memory and the view"

[[node]]
id = "message-kind"
group = "memory"
kind = "data"
name = "MessageKind"
ref = "7.1"
uses = ["source"]
text = "What one message of the memory log is: a message of the person or of the harness, a cell with its output, or a reply."

[[node]]
id = "message"
group = "memory"
kind = "data"
name = "MemoryMessage"
ref = "7.1"
uses = ["message-kind"]
text = "One step of a session in the memory log, with the time of its last entry. Its id is its index in the log."

[[node]]
id = "node-id"
group = "memory"
kind = "data"
name = "NodeId"
ops = ["span", "halves", "parent", "ref", "parse"]
ref = "7.1"
uses = []
text = "The node (level, index) covers the messages [index * 2^level, (index + 1) * 2^level). Its reference is level.index, and parse reads it back. A level is at most 62, so a span fits a Long."

[[node]]
id = "memory-line"
group = "memory"
kind = "data"
name = "MemoryLine"
ops = ["of"]
ref = "7.1"
uses = []
text = "A summary line of at most 512 bytes of UTF-8. MemoryLine.of keeps a short text and cuts a longer one at the end of a character, so a leaf never gives a longer line."

[[node]]
id = "memory"
group = "memory"
kind = "data"
name = "Memory"
ops = ["append", "ready", "buildNode", "onStandIn", "withoutStandIns", "roots", "zoom", "fork", "key"]
ref = "7.1"
spec = true
uses = ["message", "node-id", "memory-line", "line-key"]
proof_uses = ["node-id"]
text = "The log, the built lines and the stand-ins, as a pure value. ready gives the nodes whose halves are built, buildNode of another node gives the same memory, roots gives one node for each set bit, zoom gives a message or the lines of two halves, and key gives the node with a SHA-256 of its texts. A stand-in is a built node with the line of its source after a stop or a spent budget. Each built node above a stand-in is a stand-in, and withoutStandIns takes them out so they can build again."

[[node]]
id = "line-key"
group = "memory"
kind = "data"
name = "LineKey"
ref = "7.1"
uses = ["node-id"]
text = "The key of a stored line: the node, and the SHA-256 of the texts that it covers. A line of other messages has another key."

[[node]]
id = "view"
group = "memory"
kind = "data"
name = "View"
ops = ["upTo", "extend", "split", "join", "fit", "advance"]
ref = "7.1"
spec = true
uses = ["node-id", "memory"]
proof_uses = ["node-id"]
text = "A cut through the tree that covers [0, upTo). extend adds messages at the end, split shows the two halves of a node, join is its inverse, fit joins the oldest pairs until the view has at most high / 2 parts, and advance gives one extend and one fit for each message, so the view of n messages depends only on n."

[[node]]
id = "memory-log"
group = "memory"
kind = "data"
name = "MemoryLog"
ops = ["messages", "beforeOpenTurn"]
ref = "7.1"
uses = ["logged", "message"]
proof_uses = ["turn-outcome"]
text = "The log from the journal: one message for each Input, each cell with its output at its Observed, and each end of a turn, with the reply or the text of the report of the outcome (TurnOutcome.report). A longer journal gives a longer log with the same start. beforeOpenTurn counts the messages up to the reply of the last turn."

[[group]]
id = "memory-tree"
phase = "p8"
module = "harness"
file = "MemoryTree.scala"
title = "The memory tree strategy: the leaves, the store of lines, and zoom"

[[node]]
id = "compress-input"
group = "memory-tree"
kind = "data"
name = "CompressInput"
ref = "7.1"
uses = []
text = "The input of the leaf compress: one message longer than a line."

[[node]]
id = "merge-input"
group = "memory-tree"
kind = "data"
name = "MergeInput"
ref = "7.1"
uses = []
text = "The input of the leaf merge: the lines of two adjacent nodes, oldest first."

[[node]]
id = "summary"
group = "memory-tree"
kind = "data"
name = "Summary"
ref = "7.1"
uses = []
text = "The output of compress and merge: one summary line."

[[node]]
id = "line-store"
group = "memory-tree"
kind = "data"
name = "LineStore"
ops = ["inMemory"]
ref = "7"
uses = ["line-key", "memory-line"]
text = "The built lines of a session: derived data with a journal of its own. The host keeps them in the session file, and a program call keeps them in memory. A store keeps the first line of a key."

[[node]]
id = "memory-state"
group = "memory-tree"
kind = "data"
name = "MemoryState"
ref = "7.1"
uses = ["memory", "view"]
text = "The derived data of the memory tree: the memory, and the view of the messages before the open turn."

[[node]]
id = "zoom-source"
group = "memory-tree"
kind = "data"
name = "ZoomSource"
ops = ["zoom", "setReader"]
ref = "7.1"
uses = ["context-strategy"]
text = "What zoom of a cell reads: the derived data after the last policy call. The effects set a new reader after each update."

[[node]]
id = "memory-progress"
group = "memory-tree"
kind = "data"
name = "MemoryProgress"
ops = ["summaries", "summariesEnded", "projected", "none"]
ref = "10.6"
uses = []
text = "What the memory of a turn tells a client: the summaries of the memory tree while an update builds them, and the size of each projection for a call to the policy, with its budget. The reports of the summaries of one update come in order. The default does nothing. used gives the prompt and completion tokens of the last model call of a call to the policy (CLI_SCREEN.md, 14.4)."

[[node]]
id = "memory-tree"
group = "memory-tree"
kind = "data"
name = "MemoryTree"
ops = ["update", "project", "zoom", "withLeaves", "room", "render"]
ref = "7.1"
spec = true
uses = ["context-strategy", "predict", "compress-input", "merge-input", "summary", "line-store", "memory-state",
        "runtime-context", "dspy-error", "logged", "projection", "strategy-name", "signature", "policy-runner", "budget", "memory-log", "window",
        "memory-progress"]
