ref = "4.6"
uses = ["drive", "memory-journal"]
text = "With scripts of TurnEffects: a chat answer, submit, the step limit of both kinds, a failed cell, a failed LM call, a stop during a cell and a crash during a cell give the journals of section 12. For each script, the turn ends, and it is a word of the language of 4.1."

[[group]]
id = "journal-laws"
phase = "p4"
module = "harness"
file = "JournalLaws.scala"
where = "tests"
title = "The laws of the journal in memory"

[[node]]
id = "law-journal"
group = "journal-laws"
kind = "law"
name = "Journal:"
ref = "4.7"
uses = ["memory-journal"]
text = "The state is the fold of the log. run commits the entries of decide with the next seq, and a refused command adds nothing. Each entry has the time of the clock and the source of its command, and the mask hides each known secret before the commit. Commands from several threads each commit once."

[[group]]
id = "secret-laws"
phase = "p4"
module = "harness"
file = "SecretLaws.scala"
where = "tests"
title = "The law Secret"

[[node]]
id = "law-secret"
group = "secret-laws"
kind = "law"
name = "Secret:"
ref = "4.7"
uses = ["secrets"]
text = "No known secret value is in a masked text or entry, and a second mask changes nothing. A longer value goes first. known takes only the secret-like variables and the headers."

[[group]]
id = "handler-laws"
phase = "p4"
module = "harness"
file = "HandlerLaws.scala"
where = "tests"
title = "The laws of the handlers of a call"

[[node]]
id = "law-recorded"
group = "handler-laws"
kind = "law"
name = "Recorded:"
ref = "4.7"
uses = ["recorded", "recorder", "local-files", "snapshot-store", "journal-turn", "memory-journal"]
text = "The law Effect for real handlers: a call commits its intent before it runs and its outcome after, the calls of a cell get the ids 0, 1 and 2, a call after a stop or after close does not run, two calls of a cell on two threads both run, and each guest API call of the bindings goes through the recorder."

[[node]]
id = "law-local-files"
group = "handler-laws"
kind = "law"
name = "Files:"
ref = "5.4"
uses = ["local-files"]
text = "Files.local reads and writes only under the root, also through a symbolic link, keeps .git read-only, and hides the secret files that exist. It refuses a link to a place that does not exist and a file with a second hard link. edit replaces the one place of a text."

[[node]]
id = "law-snapshot-store"
group = "handler-laws"
kind = "law"
name = "Store:"
ref = "4.7"
uses = ["snapshot-store"]
text = "The law Store for the handler: load reads the snapshot and the writes of the cell, the writes are only in the buffer, and a value comes back with the type of the cell that loads it."

[[node]]
id = "law-journal-turn"
group = "handler-laws"
kind = "law"
name = "Turn:"
ref = "5.1"
uses = ["journal-turn", "memory-journal"]
text = "input reads the values of the Input entries, and now reads the clock."

[[group]]
id = "window-laws"
phase = "p4"
module = "harness"
file = "WindowLaws.scala"
where = "tests"
title = "The laws of the window strategy and of the status"

[[node]]
id = "law-window"
group = "window-laws"
kind = "law"
name = "Window:"
ref = "7"
uses = ["window"]
text = "project depends only on the entries and the derived data, fits the budget, keeps the last observation and the newest steps, oldest first, keeps the last step also with a long text and code, and cuts a long value with a note. update gives no derived data."

[[node]]
id = "law-status"
group = "window-laws"
kind = "law"
name = "Status:"
ref = "7"
uses = ["status"]
text = "The status gives the step, the step limit and the keys of the store."

[[group]]
id = "harness-laws"
phase = "p4"
module = "harness"
file = "HarnessLaws.scala"
where = "tests"
title = "The laws of a harness, with a scripted model and a real REPL"

[[node]]
id = "law-harness"
group = "harness-laws"
kind = "law"
name = "Harness:"
ref = "9"
uses = ["harness"]
text = "A policy that submits gives the output through Data, and in RawPrediction.values. A reply with no code and the step limit run the finisher. The call works in a copy of the workspace, exec runs in the sandbox, and a failed model call gives a DspyError. The store keeps only the writes of a cell that completed. A code of null or None is no code. After the heap guard closes the REPL, the turn stops. A workspace that cannot be copied gives a DspyError and leaves no copy, and the copy leaves out a named pipe. The journal of a call is one turn, and it holds no known secret. The REPL has only the givens of the task mode."

[[group]]
id = "structure-laws"
phase = "p4"
module = "harness"
file = "StructureLaws.scala"
where = "tests"
title = "The laws of the structure, and what the optimizers need"

[[node]]
id = "law-structure"
group = "structure-laws"
kind = "law"
name = "Structure:"
ref = "9"
uses = ["harness-structure", "harness"]
text = "The leaves are the policy and the finisher, with distinct keys. A replace with the parameters that read gives changes no parameter, a replace changes only the instructions of the leaves, and the arity agrees with the leaves."

[[node]]
id = "law-optimizers"
group = "structure-laws"
kind = "law"
name = "Optimizers:"
ref = "9"
uses = ["harness-structure", "harness-runner", "harness"]
text = "A harness has what each optimizer needs, P: {OptimizableStructure, ProgramRunner}, and the runner reads a record of the inputs and gives the output in RawPrediction.values."

[[group]]
id = "harness-mutants"
phase = "p4"
module = "harness"
file = "mutants.toml"
where = "tests"
title = "The mutants of the harness"

[[node]]
id = "harness-mutants"
group = "harness-mutants"
kind = "check"
name = "Mutant:"
ref = "4.7"
uses = ["law-drive", "law-journal", "law-secret", "law-recorded", "law-local-files", "law-snapshot-store", "law-window",
        "law-harness", "law-structure"]
text = "Each mutant breaks one rule of drive, the journal, the mask, the handlers, the window or the harness, and at least one law must fail. scripts/mutants/mutants.py runs the list, with a time limit for each mutant."
