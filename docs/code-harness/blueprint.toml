uses = ["secrets"]
text = "No known secret value is in a masked text or entry, and a second mask changes nothing. A longer value goes first. known takes only the secret-like variables and the headers."

[[group]]
id = "handler-laws"
phase = "p4"
module = "harness"
file = "HandlerLaws.scala"
where = "tests"
title = "The laws of the handlers of a call"

[[node]]
id = "law-recorded"
