text = "What a harness needs that an optimizer must not change: the workspace, the home folder, the hosts, the backend, the secrets and the mode. The task mode gives Files^, Shell^, Llm^, Children^ and Store^, as 8.1 gives a rollout. journals gets the id and the journal of each call and of each child, because the owner of a rollout is an optimizer, which reads the journal (8.6). Each session of a call has its own id since phase 7."

[[node]]
