kind = "data"
name = "McpServer"
ops = ["runCell", "serve"]
ref = "6"
uses = ["scala-repl", "bindings", "layout"]
text = "Two tools: run_cell(code) and api_reference. Only the transport writes to stdout. The server gives files: Files on a workspace and state: Store^ in memory, with no shell, network, LM or sessions. exec takes Files^, and the server has no handler that writes files."

[[group]]
id = "mcp-laws"
phase = "p2"
module = "harness-mcp"
file = "McpLaws.scala"
where = "tests"
title = "The laws of the MCP server, in this JVM and over stdio"

[[node]]
id = "law-mcp"
group = "mcp-laws"
kind = "law"
name = "MCP:"
ref = "6"
uses = ["mcp-server"]
text = "A cell reads the workspace and nothing outside it, cannot read a file with a secret name or a secret path of the home folder, cannot write, keeps values in the store, and another agent runs cells over stdio with only the protocol on stdout."

# ── Phase 3: the profile of a child process (5.4). It is pure, so the laws need no OS. ──────────────────────────────

[[group]]
id = "profile"
phase = "p3"
module = "harness-sandbox"
file = "Profile.scala"
title = "What a child process can do: the profile, and the profile of a mode"

[[node]]
id = "layout"
group = "profile"
kind = "data"
name = "Layout"
ref = "5.4"
uses = []
text = "The places of the host that a profile names, apart from the scope: the private temporary directory, the folder of the journals, the secret paths (~/.ssh, ~/.aws and more) and the names of secret files (.env)."

[[node]]
id = "host-list"
group = "profile"
kind = "data"
name = "HostList"
ops = ["allows"]
ref = "5.4"
spec = true
uses = []
text = "The hosts and the ports that the proxy lets through: name, name:port or name:*, and *.d for each subdomain of d. A pattern with no port allows only the ports 80 and 443. A proposal: the design names the host list of the guarded handler and gives no type."

[[node]]
id = "net"
group = "profile"
kind = "data"
name = "Net"
ref = "5.4"
uses = ["host-list"]
text = "The network of a child process: closed, or only the proxy of the session, which applies the host list."

[[node]]
id = "profile"
group = "profile"
kind = "data"
name = "Profile"
ops = ["canRead", "canWrite", "canConnect", "hide", "words"]
ref = "5.4"
spec = true
uses = ["net", "layout"]
proof_uses = ["host-list"]
text = "What a child process can do, as observations: canRun, canRead(path), canWrite(path) and canConnect(host). A backend turns a profile into the rules of the OS. hide(paths) gives a profile that allows less: nothing under the paths. Profiles.words gives the same rules in words for the task of the model: the places that a command can write, the read-only parts such as .git, the closed paths and the network. hiddenNames are the secret names that the backend closes in each folder, and isHidden, canRead and canWrite read them. forMode gives them only for a backend that closes a name (5.4)."

[[node]]
id = "profile-for-mode"
group = "profile"
kind = "function"
name = "forMode"
ref = "5.4"
spec = true
uses = ["mode", "layout", "profile"]
text = "The profile of the table of 5.4: no child process without Shell^ and Files^; writes only under the scope and the private temporary directory, with .git read-only; the proxy only with Network^; in each mode, the secrets and the journals are not readable, and the other paths are read-only."

[[node]]
id = "profile-for-command"
group = "profile"
kind = "function"
name = "forCommand"
ref = "5.4"
spec = true
uses = ["mode", "layout", "host-list", "profile"]
proof_uses = ["profile-for-mode", "profile", "secret-index"]
text = "The profile of one command: the profile of the mode, which also hides each file with a secret name that exists in a writable root when the command starts, and the target of each one that is a symbolic link. The walk skips .git. A command can make a new file with a secret name, and the next command cannot read it."

[[node]]
id = "secret-index"
group = "profile"
kind = "data"
name = "SecretIndex"
ops = ["find", "listings", "progress"]
ref = "5.4"
spec = true
uses = ["profile", "layout"]
text = "The secret files of the writable roots, with a cache of the listing of each folder. It lists a folder again when its change time, last-modified time or file key differs, or when it changed in the last 2 seconds, because a file time on Linux can be coarse. A folder that it cannot read is hidden as a whole. The shell does not use it since 2026-11-12: a walk before each command made each command wait in a large scope (5.4)."

# ── Phase 3: the environment of a child process (5.6) ───────────────────────────────────────────────────────────

[[group]]
id = "environment"
phase = "p3"
module = "harness-sandbox"
file = "Environment.scala"
title = "The allowlist of environment variables"

[[node]]
id = "child-env"
group = "environment"
kind = "function"
name = "forChild"
ref = "5.6"
spec = true
uses = []
text = "The variables of a command: the names of the allowlist of 5.6 and the names of SessionConfig.env, with the values of the harness process. A name that contains KEY, SECRET, TOKEN, PASSWORD, PASSWD, CREDENTIAL or AUTH never goes through."

# ── Phase 3: the backends (5.4, CODE_HARNESS.md F8). Seatbelt and bubblewrap do not share a file, so they can run at the
# same time. ──────────────────────────────────────────────────────────────────────────────────────────────────────

[[group]]
id = "backend"
phase = "p3"
module = "harness-sandbox"
file = "Backend.scala"
title = "An OS sandbox that runs a command under a profile"

[[node]]
id = "backend"
group = "backend"
kind = "data"
name = "Backend"
ref = "5.4"
uses = ["profile"]
text = "An OS sandbox: it gives the command line that runs a command under a profile, and it says if it works on this host. It works when a shell runs under that command line, with a profile like the profile of a session. closesNames is true for a backend that closes a secret name in each folder with no walk: Seatbelt, and not bubblewrap."

[[group]]
id = "seatbelt"
phase = "p3"
module = "harness-sandbox"
file = "Seatbelt.scala"
title = "The backend for macOS: sandbox-exec and a profile in SBPL"

[[node]]
id = "seatbelt"
group = "seatbelt"
kind = "data"
name = "Seatbelt"
ops = ["policy", "wrap"]
ref = "5.4"
spec = true
uses = ["backend", "profile"]
text = "The SBPL text of a profile for /usr/bin/sandbox-exec. It denies by default, as Codex does: a child can start processes, read files, and look only at the processes of its own sandbox. It has no access to launchd and the other services of the system. Each secret name of the profile gets one rule on the path, a regex for each folder (nameRule), so a command needs no walk of the scope."

[[group]]
id = "bubblewrap"
phase = "p3"
module = "harness-sandbox"
file = "Bubblewrap.scala"
title = "The backend for Linux: bwrap and its arguments"

[[node]]
id = "bubblewrap"
group = "bubblewrap"
kind = "data"
name = "Bubblewrap"
ops = ["flags", "wrap"]
ref = "5.4"
spec = true
uses = ["backend", "profile"]
proof_uses = ["seccomp"]
text = "The bwrap arguments of a profile: the root read-only, the scope and the temporary directory writable, .git read-only, an empty folder or file over each secret, and new namespaces for the pids and the network. A proposal: on Linux the network stays closed also with Network^, because the proxy needs a bridge into the namespace. That is less authority, so the law holds. It cannot close a name, so a command reads a file with a secret name in the scope: the gap of 5.4."

[[group]]
id = "seccomp"
phase = "p3"
module = "harness-sandbox"
file = "Seccomp.scala"
title = "The seccomp filter of bubblewrap"

[[node]]
id = "seccomp"
group = "seccomp"
kind = "data"
name = "Seccomp"
ops = ["program", "file"]
ref = "5.4"
spec = true
uses = ["layout"]
text = "A classic BPF program for aarch64 and x86_64: socket for AF_UNIX, socketpair for a datagram pair, io_uring_setup and each call of another ABI get EPERM. A read-only mount does not stop a connection to a UNIX socket of the host, so with no filter a command reaches the D-Bus bus or docker.sock. bwrap loads it from a file that no command can write."

[[group]]
id = "backends"
phase = "p3"
module = "harness-sandbox"
file = "Backends.scala"
title = "The choice of a backend on this host"

[[node]]
id = "backend-detect"
group = "backends"
kind = "function"
name = "detect"
ref = "5.4"
uses = ["backend"]
proof_uses = ["seatbelt", "bubblewrap"]
text = "The first backend that works on this host: Seatbelt on macOS, bubblewrap on Linux, or none."

# ── Phase 3: the proxy of the network (5.4) ─────────────────────────────────────────────────────────────────────

[[group]]
id = "proxy"
phase = "p3"
module = "harness-sandbox"
file = "HostProxy.scala"
title = "The proxy that applies the host list"

[[node]]
id = "host-proxy"
group = "proxy"
kind = "data"
name = "HostProxy"
ops = ["port", "close"]
ref = "5.4"
spec = true
uses = ["host-list"]
proof_uses = ["host-list"]
text = "An HTTP proxy on the loopback address, for plain requests and CONNECT. It lets a request through only when the list allows its host at its port, and it sends the Host header of the URL that it checked. It serves at most a limit of connections, with 503 above it, and a side that is silent for the idle time ends the connection. A Seatbelt profile lets a child reach only this port."

# ── Phase 3: the handler of Shell (5.3) ─────────────────────────────────────────────────────────────────────────

[[group]]
id = "sandboxed-shell"
phase = "p3"
module = "harness-sandbox"
file = "SandboxedShell.scala"
title = "Shell.sandboxed: exec in an OS sandbox"

[[node]]
id = "sandboxed-shell"
group = "sandboxed-shell"
kind = "data"
name = "SandboxedShell"
ops = ["exec", "close", "launch", "stopAll"]
ref = "5.3"
spec = true
uses = ["shell", "files", "session-config", "layout", "host-list", "backend"]
proof_uses = ["profile-for-mode", "profile-for-command", "child-env", "host-proxy", "process-wrapper"]
text = "Shell.sandboxed(root, profile) of 5.3. exec runs the command in the backend, under the profile of the mode of the session, with the allowlist of variables and a time limit. With no backend, or in a mode with no child process, exec fails and the command does not run. spawn and the job table come with phase 7."

# ── Phase 3: the laws ───────────────────────────────────────────────────────────────────────────────────────────

[[group]]
id = "profile-laws"
phase = "p3"
module = "harness-sandbox"
file = "ProfileLaws.scala"
where = "tests"
title = "The laws of the profile, as properties"

[[node]]
id = "law-profile-monotone"
group = "profile-laws"
kind = "law"
name = "Monotone:"
ref = "5.4"
uses = ["profile-for-mode"]
text = "If m1 <= m2, the profile of m2 allows each run, read, write and host that the profile of m1 allows. A profile that hides more paths allows less, and nothing under them."

[[node]]
id = "law-profile-authority"
group = "profile-laws"
kind = "law"
name = "Authority:"
ref = "5.4"
uses = ["profile-for-mode", "profile-for-command"]
text = "The profile of a mode allows a child process only with Shell^ and Files^, a write only under the scope or the private temporary directory and never in .git, a host only with Network^ and on the list, and in no mode a read or a write of a secret or of the journals. The profile of a command also hides each file with a secret name that exists in a writable root, apart from .git."

[[node]]
id = "law-secret-index"
group = "profile-laws"
kind = "law"
name = "Index:"
ref = "5.4"
uses = ["secret-index", "profile-for-mode"]
text = "After each change of the files, the index gives the secret files of a new walk. A folder that changed in the last two seconds is listed again, also with the same time, and a folder that the index cannot read is hidden as a whole."

[[node]]
id = "law-secret-names"
group = "profile-laws"
kind = "law"
name = "Secret names:"
ref = "5.4"
uses = ["profile", "layout"]
text = "A profile of a backend that closes names closes each path with a part that is a secret name, at each depth, as a file and as a folder, and keeps .envrc and notes.env.txt open. The words say that a command and a file call cannot reach a secret name only when the backend closes it, and else that a file call cannot."

[[node]]
id = "law-host-list"
group = "profile-laws"
kind = "law"
name = "Hosts:"
ref = "5.4"
uses = ["host-list"]
text = "A host is allowed when a pattern names it, with no case. *.d matches each subdomain of d and not d. An empty list allows no host."

[[group]]
id = "environment-laws"
phase = "p3"
module = "harness-sandbox"
file = "EnvironmentLaws.scala"
where = "tests"
title = "The laws of the allowlist of variables"

[[node]]
id = "law-env"
group = "environment-laws"
kind = "law"
name = "Environment:"
ref = "5.6"
uses = ["child-env"]
text = "A command gets only the names of the allowlist and of the session that the harness process has, with their values, and never a name with a secret word. GIT_AUTHOR_NAME, GIT_AUTHOR_EMAIL and GIT_AUTHOR_DATE are not secret. More names of the session never remove a name, and a second filter changes nothing."

[[group]]
id = "seatbelt-laws"
phase = "p3"
module = "harness-sandbox"
file = "SeatbeltLaws.scala"
where = "tests"
title = "The escape tests on macOS"

[[node]]
id = "law-seatbelt"
group = "seatbelt-laws"
kind = "law"
name = "Seatbelt:"
ref = "5.4"
uses = ["seatbelt", "profile-for-mode"]
text = "On macOS, for the profile of each mode of 5.2, a real child process can do what the probes of the profile allow and nothing more: writes in the scope, in the temporary directory, outside and in .git; reads of a secret, a .env file, a secret file with a quote in its name and the journals; a new file with a secret name; a hard link to a secret and to a .env file; a move of a .env file; a UNIX socket of the host; a child of the child; the network, directly and through the proxy; the processes outside the sandbox and launchd. When the backend works, a command runs under the profile of each mode with a child process."

[[group]]
id = "bubblewrap-laws"
phase = "p3"
module = "harness-sandbox"
file = "BubblewrapLaws.scala"
where = "tests"
title = "The escape tests on Linux"

[[node]]
id = "law-bubblewrap"
group = "bubblewrap-laws"
kind = "law"
name = "Bubblewrap:"
ref = "5.4"
uses = ["bubblewrap", "profile-for-mode"]
text = "On Linux with bwrap, the probes of Seatbelt give what the profile allows, apart from the network of Network^, which stays closed. The tests skip on a host with no working bwrap. scripts/sandbox-linux/run.sh runs them in a podman container, and the blueprint reads its report. A stop of the wrapper at each point of the start of bwrap leaves no process of the command."

[[group]]
id = "seccomp-laws"
phase = "p3"
module = "harness-sandbox"
file = "SeccompLaws.scala"
where = "tests"
title = "The laws of the seccomp filter, on a model of classic BPF"

[[node]]
id = "law-seccomp"
group = "seccomp-laws"
kind = "law"
name = "Seccomp:"
ref = "5.4"
uses = ["seccomp"]
text = "On a model of classic BPF: socket for AF_UNIX, socketpair for SOCK_DGRAM and io_uring_setup get EPERM, the other calls are allowed, each call of another ABI gets EPERM, and another arch has no program. The escape tests run the real filter on Linux."

[[group]]
id = "proxy-laws"
phase = "p3"
module = "harness-sandbox"
file = "ProxyLaws.scala"
where = "tests"
title = "The laws of the proxy"

[[node]]
id = "law-proxy"
group = "proxy-laws"
kind = "law"
name = "Proxy:"
ref = "5.4"
uses = ["host-proxy"]
text = "A plain request and a CONNECT for a host on the list reach the host. A request for another host or port gets 403, and the proxy opens no connection for it. The Host header comes from the URL. A connection above the limit gets 503, a silent host ends at the idle time, and a download goes on while the client is silent."

[[group]]
id = "shell-laws"
phase = "p3"
module = "harness-sandbox"
file = "SandboxedShellLaws.scala"
where = "tests"
title = "exec runs only in a sandbox"

[[node]]
id = "law-exec"
group = "shell-laws"
kind = "law"
name = "Exec:"
ref = "5.3"
uses = ["sandboxed-shell"]
proof_uses = ["backend-detect"]
text = "With no backend, or in a mode with no child process, exec fails and the command does not run. Else the command runs in the sandbox of the mode: it sees only the variables of the allowlist, it cannot write outside the scope, also from its own child, and the time limit stops it and its children. A zombie counts as stopped, so the handler does not wait for it. The secret paths of the home folder and the journals stay closed. On a backend that closes names, a command reaches no file and no folder with a secret name, also through a link, a copy or a move, and it cannot make one. On bubblewrap a command reads such a file: the gap of 5.4."

# ── Phase 3: the mutants of the sandbox ─────────────────────────────────────────────────────────────────────────

[[group]]
id = "sandbox-mutants"
phase = "p3"
