[[node]]
id = "harness"
group = "harness"
kind = "data"
name = "Harness"
ops = ["forward", "forTask", "forkWorkspace"]
ref = "9"
spec = true
uses = ["dspy-module", "signature", "predict", "policy-input", "policy-step", "finish-input", "context-strategy",
        "harness-env", "harness-limits", "data", "runtime-context", "dspy-error", "sub-query", "sub-answer", "mode",
        "session-id"]
proof_uses = ["drive", "memory-journal", "harness-effects", "recorded", "local-files", "snapshot-store", "journal-turn",
              "sandboxed-shell", "profile-for-mode", "layout", "preamble", "scala-repl", "window", "budget",
              "host-threads", "leaf-llm", "child-turns", "child-start", "rejection", "cell-outcome"]
text = "A harness for one task, as a dspy4s Module. forward copies the workspace, starts a journal in memory and a REPL with the handlers of the mode, sends the input fields, runs drive and reads the last TurnEnded: Submitted gives the output through Data, Replied and Exhausted run the finisher. The transcript of the finisher gives the outcome of each cell in words (CellOutcome.words). Since phase 5 a child of rlm has the same session path: its own journal, a new REPL with a preamble from Data[A].shape, the same policy leaf, the window strategy and the same copy, files and shell. Only submit gives the value of a child. modeAt gives Children^ only below the depth limit. A proposal: the leaves are policy, finisher and subQuery."

[[group]]
id = "harness-givens"
phase = "p4"
module = "harness"
