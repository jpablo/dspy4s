uses = ["law-stop", "law-effect", "law-grant", "law-pending", "law-job", "law-flush", "law-report", "law-inputs"]
blocked = "Choose how the mutants run: stryker4s, or hand-written versions of single rules in the tests."
text = "Each mutant of section 12 breaks one rule, and at least one property must fail."

# ── Phase 1: the laws of 4.7 that the kernel alone can show ──────────────────────────────────────────────────

[[node]]
id = "law-fold"
phase = "p1"
kind = "law"
name = "Fold:"
ref = "4.7"
spec = true
uses = ["session-state", "evolve"]
text = "SessionState is the fold of the journal."

[[node]]
id = "law-homomorphism"
phase = "p1"
kind = "law"
name = "Homomorphism:"
ref = "4.7"
spec = true
uses = ["session-state", "evolve"]
text = "state(a ++ b) is the fold of b from state(a)."

[[node]]
id = "law-language"
phase = "p1"
kind = "law"
name = "Language:"
ref = "4.7"
spec = true
uses = ["decide", "schedules"]
text = "Each journal is a word of the language of 4.1."

[[node]]
id = "law-effect"
phase = "p1"
kind = "law"
name = "Effect:"
ref = "4.7"
spec = true
uses = ["decide", "repair", "schedules"]
text = "An intent commits before its effect, and the outcome commits after the effect. Each intent has exactly one outcome after a repair."

[[node]]
id = "law-stop"
phase = "p1"
kind = "law"
name = "Stop:"
ref = "4.7"
spec = true
uses = ["next", "decide", "schedules"]
text = "After StopRequested, next starts no new work, and decide accepts no new intent."

[[node]]
id = "law-input"
phase = "p1"
kind = "law"
name = "Input:"
ref = "4.7"
spec = true
uses = ["decide"]
text = "Two Send commands with one request id give one Input."

[[node]]
id = "law-rest"
phase = "p1"
kind = "law"
name = "Rest:"
ref = "4.7"
spec = true
uses = ["decide", "evolve", "schedules"]
text = "With no open turn, no input waits."

[[node]]
id = "law-flush"
phase = "p1"
kind = "law"
name = "Flush:"
ref = "4.7"
spec = true
uses = ["needs-flush", "schedules"]
text = "After a power loss, the journal is a prefix that ends at the last flush. Each effect that changed the world has its intent in it, and so does each Input for which a sender got an answer. Phase 1 cuts the journal at the last flush; a real power loss is not in phase 1."

[[node]]
id = "law-grant"
phase = "p1"
kind = "law"
name = "Grant:"
ref = "4.7"
spec = true
uses = ["evolve", "decide", "forked", "guard-check", "schedules"]
text = "A Once grant covers one call. A Turn grant ends at the next TurnEnded. No grant stays after Ended, and a journal fork starts with no grants. A repeat of a Grant commits nothing."

[[node]]
id = "law-pending"
phase = "p1"
kind = "law"
name = "Pending call:"
ref = "4.7"
spec = true
uses = ["guard-check", "evolve", "forked", "goal-check-due", "schedules"]
text = "A pending call has no active grant that covers it. TurnStarted and Ended empty pending, and a journal fork starts with no pending calls. A session with no person never gets a pending call."

[[node]]
id = "law-guard"
phase = "p1"
kind = "law"
name = "Guard:"
ref = "4.7"
spec = true
uses = ["guard", "guard-check"]
text = "verdict is a homomorphism from Guard to Verdict. A grant changes only Ask, and more grants never make a result stronger."

[[node]]
id = "law-job"
phase = "p1"
kind = "law"
name = "Job:"
ref = "4.7"
spec = true
uses = ["decide", "evolve", "forked", "schedules"]
text = "An Abort changes no job. A stop covers only the jobs with an intent before it. After Abort and then StopJobs(OfLastTurn), no job of that turn starts or runs. Ended stops all jobs, and a journal fork starts with no jobs. Phase 1 has the job table as a small value, with no process."

[[node]]
id = "law-repair"
phase = "p1"
kind = "law"
name = "Repair:"
ref = "4.7"
spec = true
uses = ["repair", "evolve"]
text = "repair closes each open part, and repair(state after repair) is empty."

[[node]]
id = "law-store"
phase = "p1"
kind = "law"
name = "Store:"
ref = "4.7"
spec = true
uses = ["evolve"]
text = "The store holds only the writes of cells that completed."

[[node]]
id = "law-inputs"
phase = "p1"
kind = "law"
name = "Inputs:"
ref = "4.7"
spec = true
uses = ["evolve", "forked"]
text = "inputs is the fold of the values of the Input entries. A repeat adds nothing, a fork keeps them, and the store does not hold them."

[[node]]
id = "law-log"
phase = "p1"
kind = "law"
name = "Log:"
ref = "4.7"
spec = true
uses = ["decide"]
text = "No part of the harness changes or removes an entry."

[[node]]
id = "law-report"
phase = "p1"
kind = "law"
name = "Report:"
ref = "4.7"
spec = true
uses = ["reports", "missing"]
text = "After the report pass of 8.6, each TurnEnded or Ended that needs a report has exactly one Input in the journal of an open owner. Phase 1 checks only reports and missing; the report pass of a real host comes later."

[[node]]
id = "law-codec"
phase = "p1"
kind = "law"
name = "Journal codec:"
ref = "4.1"
spec = true
uses = ["logged"]
text = "A journal read through the codec of Logged gives the same entries."

[[node]]
id = "law-decide-table"
phase = "p1"
kind = "law"
name = "Decide table:"
ref = "4.5"
spec = true
uses = ["decide"]
text = "Each row of the table of decide in 4.5 holds, for example: a Send to a session that has ended commits nothing and gets SessionClosed."

[[node]]
id = "law-next-rules"
phase = "p1"
kind = "law"
name = "Next rules:"
ref = "4.3"
spec = true
uses = ["next"]
text = "The rules of next in 4.3: the step limit of both kinds of turn, a stop, an answer, and a submit."
