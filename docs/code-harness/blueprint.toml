[[node]]
id = "law-drive"
group = "drive-laws"
kind = "law"
name = "Drive:"
ref = "4.6"
uses = ["drive", "memory-journal"]
text = "With scripts of TurnEffects: a chat answer, submit, the step limit of both kinds, a failed cell, a failed LM call, a stop during a cell and a crash during a cell give the journals of section 12. A policy call that fails during a stop ends the turn Aborted, not Failed. For each script, the turn ends, and it is a word of the language of 4.1."

[[group]]
id = "journal-laws"
phase = "p4"
module = "harness"
file = "JournalLaws.scala"
where = "tests"
title = "The laws of the journal in memory"

[[node]]
id = "law-journal"
group = "journal-laws"
kind = "law"
name = "Journal:"
ref = "4.7"
uses = ["memory-journal"]
text = "The state is the fold of the log. run commits the entries of decide with the next seq, and a refused command adds nothing. Each entry has the time of the clock and the source of its command, and the mask hides each known secret before the commit. Commands from several threads each commit once."

[[group]]
id = "secret-laws"
phase = "p4"
module = "harness"
