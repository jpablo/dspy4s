name = "Recorded:"
ref = "4.7"
uses = ["recorded", "recorder", "local-files", "snapshot-store", "journal-turn", "memory-journal"]
text = "The law Effect for real handlers: a call commits its intent before it runs and its outcome after, the calls of a cell get the ids 0, 1 and 2, a call after a stop or after close does not run, two calls of a cell on two threads both run, and each guest API call of the bindings goes through the recorder."

[[node]]
id = "law-local-files"
group = "handler-laws"
kind = "law"
name = "Files:"
