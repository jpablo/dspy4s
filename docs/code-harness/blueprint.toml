title = "The laws of the drafts of the policy"

[[node]]
id = "law-draft"
group = "draft-laws"
kind = "law"
name = "Draft:"
ref = "10.6"
uses = ["draft", "drafts", "harness-effects"]
text = "The text of a whole reply is the text of the step that the policy parses from it, in each form of PolicyAdapter.values and of the chat format. No part of a reply shows a part of a marker, of a fence or of the code, and the text of a part is a part of the text of the whole reply. The reasoning is the native reasoning, else the section of reasoning. Drafts give no draft outside a model call, a new model call drops the draft before it, and a call that ended or that a later call replaced changes nothing. callPolicy with drafts shows the reasoning and the text while the model writes, and none after. It gives the same step as with no drafts, also with the call of the fallback adapter and with a model that does not stream."
