# The blueprint of the code harness: the plan of CODE_HARNESS_DESIGN.md as a graph.
#
# Edit only this file by hand. `python3 scripts/blueprint/blueprint.py` reads it and the build results, and writes
# CODE_HARNESS_BLUEPRINT.html. The script finds the state of each node; this file holds no state, except the date of
# a review of a spec node.
#
# A phase:
#   id, number, title and result come from section 15.
#   modules  the sbt modules that the phase makes. The script reads modules/<module>/src and the test reports in
#            modules/<module>/target/test-reports.
#   uses     the phases whose results this phase needs. A node can also use a node of another phase. The plan then
#            shows a dashed arrow, because the phase needs only some nodes of the other phase.
#   partial  true when the blueprint has only some nodes of the phase
#
# A group is a work package: the nodes in one file. Two groups have no file in common, so two writers can work on
# two groups at the same time.
#   id       a unique name, used in the `group` of a node
#   phase    the phase that makes the group
#   module   the module of the file, one of the modules of the phase
#   file     the name of the file, for example "Entry.scala". The check warns when the code of a node is in another
#            file.
#   where    "tests" for test code
#   title    a short description
#
# A node:
#   id       a unique name, used in `uses`
#   group    the group of the node. The node has the phase of its group. An upstream node has no group.
#   kind     "upstream" (a type of a library), "data" (a type), "function", "law" or "check"
#   name     what the scan looks for: the Scala name of a type or function, or, for a law or check, the start of
#            the test names, for example "Fold:" for test("Fold: ...")
#   ops      for a type with methods: the methods that need a body
#   ref      the section of CODE_HARNESS_DESIGN.md
#   spec     true when the node crosses a boundary (the journal, a command, a law): a person must review it
#   reviewed the date of that review
#   blocked  a reason when the design must change before the work can start
#   uses     the nodes that the statement needs: the types of the fields and of the signature. The check compares
#            them with the names in the code.
#   proof_uses
#            more nodes that the proof needs, for example a function or a method that a body calls. As in a Lean
#            blueprint, the page draws these arrows dashed. A proof also needs the functions in `uses`, and the
#            proof of a law or a check needs each node in `uses` that has a proof.
#   text     the statement of a law (from section 4.7), or a short note

[meta]
title = "Code harness blueprint"
design = "CODE_HARNESS_DESIGN.md"

# ── Phases (section 15). `uses` comes from the module table of 10.5 and from what each phase needs. ─────────────────

[[phase]]
id = "p1"
number = 1
title = "Kernel"
modules = ["harness-kernel"]
uses = []
result = "The laws of 4.7 run in CI."

[[phase]]
id = "p2"
number = 2
title = "Guest API and REPL"
modules = ["harness-guest", "harness-repl", "harness-mcp"]
uses = []
result = "Model code runs against the guest API in each mode, and another agent can run cells through MCP."

[[phase]]
id = "p3"
number = 3
title = "Sandbox"
modules = ["harness-sandbox"]
uses = ["p1"]
result = "exec runs only in a sandbox."

[[phase]]
id = "p4"
number = 4
title = "One task"
modules = ["harness"]
uses = ["p1", "p2", "p3"]
result = "A harness for one task that the optimizers accept."

[[phase]]
id = "p5"
number = 5
title = "RLM"
modules = ["harness"]
uses = ["p4"]
result = "RLM in the harness."

[[phase]]
id = "p6"
number = 6
title = "Optimization"
modules = []
uses = ["p4"]
result = "A first measured improvement, or a reason for its absence."

[[phase]]
id = "p7"
number = 7
title = "The session host"
modules = ["harness-host", "harness-cli", "harness", "harness-sandbox", "harness-repl"]
uses = ["p4"]
result = "A coding agent for daily use, one session at a time."

[[phase]]
id = "p8"
number = 8
title = "Memory"
modules = ["harness", "harness-guest", "harness-host"]
uses = ["p2", "p4", "p7"]
result = "Long sessions that lose no detail."

[[phase]]
id = "p9"
number = 9
title = "The controller"
modules = ["harness-kernel", "harness-guest", "harness", "harness-host", "harness-cli"]
uses = ["p7", "p8"]
result = "One controller above all sessions."

[[phase]]
id = "p10"
number = 10
title = "The graph"
modules = []
uses = ["p9"]
result = "Questions about the history of a session that a graph answers."

# ── Types of libraries. They have no group, and each phase can use them. ────────────────────────────────────────────

[[node]]
id = "json"
kind = "upstream"
name = "Json"
ref = "4.1"
uses = []
text = "The JSON value of zio-blocks. Each value in an entry is a Json, with only the six JSON cases."

[[node]]
id = "schema"
kind = "upstream"
name = "Schema"
ref = "4.1"
uses = []
text = "The codec of zio-blocks. Each type of the journal derives one."

[[node]]
id = "dspy-module"
kind = "upstream"
name = "Module"
ref = "9"
uses = []
text = "A program of dspy4s: forward(call)(using RuntimeContext) gives Either[DspyError, Prediction[O]]. A harness is one, so the optimizers take it."

[[node]]
id = "predict"
kind = "upstream"
name = "Predict"
ref = "9"
uses = []
text = "A leaf of dspy4s: one LM call with a signature. An optimizer changes its instructions and its demos. Each leaf of a program needs a distinct name, because the traces carry it."

[[node]]
id = "signature"
kind = "upstream"
name = "Signature"
ref = "9"
uses = []
text = "The typed signature of dspy4s: the input and output fields, with a Shape for each side."

[[node]]
id = "optimizable-structure"
kind = "upstream"
name = "OptimizableStructure"
ref = "9"
uses = []
text = "The leaves of a program for an optimizer: inspectNamed and replace, with the law arityAgreement."

[[node]]
id = "program-runner"
kind = "upstream"
name = "ProgramRunner"
ref = "9"
uses = []
text = "How an optimizer runs a program: a record of the inputs gives a RawPrediction. Each optimizer takes P: {OptimizableStructure, ProgramRunner}."

[[node]]
id = "runtime-context"
kind = "upstream"
name = "RuntimeContext"
ref = "9"
uses = []
text = "What a dspy4s program gets at a call: the LM, the adapter, the callbacks and the trace."

[[node]]
id = "dspy-error"
kind = "upstream"
name = "DspyError"
ref = "9"
uses = []
text = "The error type of dspy4s."

[[node]]
id = "history"
kind = "upstream"
name = "History"
ref = "7"
uses = []
text = "The earlier calls of a conversation, as an input field of a signature."

