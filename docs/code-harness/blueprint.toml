ref = "10.6"
uses = ["draft"]
text = "The drafts of the calls to the policy of one activation. Each call has a number from begin, and end closes it. A model call starts a new draft, and a number that is not the number of the open call changes nothing, so a late token of a call that a stop cut shows nowhere. A client reads current with no wait for the call."

[[node]]
id = "policy-stream"
group = "draft"
kind = "data"
name = "PolicyStream"
ops = ["wrap", "around"]
ref = "10.6"
uses = ["drafts", "runtime-context"]
text = "The stream of one call to the policy. Each model call gets a preview session of the streaming module, so its tokens go to the drafts and do not count as output that a person saw. The predictor still tries its fallback adapter after a parse error, so the step is the same as with no stream."

[[group]]
id = "policy-options-laws"
phase = "p7"
module = "harness"
file = "PolicyOptionsLaws.scala"
where = "tests"
title = "The laws of the model options and the tokens of a call to the policy (CLI_SCREEN.md, 14)"

[[node]]
id = "law-options"
group = "policy-options-laws"
kind = "law"
name = "Options:"
ref = "10.6"
uses = ["harness-effects"]
text = "A call to the policy sends the options of the model of the session. After a ModelChanged, the next call sends the new effort in the same activation. With the effort none, the request sends none, the prompt has no reasoning field, and a reply with no reasoning gives a step."

[[node]]
id = "law-tokens"
group = "policy-options-laws"
kind = "law"
name = "Tokens:"
ref = "10.6"
uses = ["harness-effects", "memory-progress"]
text = "callPolicy gives its progress the prompt and completion tokens of its model call, also of a call that streams, and a call with no usage gives no tokens."

[[group]]
id = "project-files"
phase = "p7"
module = "harness"
file = "ProjectFiles.scala"
title = "The files of the project in the task of a work session"

[[node]]
id = "project-files"
group = "project-files"
kind = "data"
name = "ProjectFiles"
ops = ["section"]
ref = "10.6"
uses = ["files"]
proof_uses = ["text-prefix"]
text = "AGENTS.md, then the first of README.md, README, README.rst and README.txt, at the top of the folder of the session. of reads each one through the file calls of the session, so the rules of read apply, and a missing file, a folder or a text that is not UTF-8 gives no part. cut keeps at most 8,000 characters, up to a line end. section gives the text of the task, each file between its lines, with a note of the size of a cut file. A session reads them once at each activation."

[[group]]
id = "project-files-laws"
phase = "p7"
module = "harness"
file = "ProjectFilesLaws.scala"
where = "tests"
title = "The laws of the files of the project"

[[node]]
id = "law-project-files"
group = "project-files-laws"
kind = "law"
name = "Project files:"
ref = "10.6"
uses = ["project-files", "local-files"]
text = "of gives AGENTS.md, then the first README that exists, and README.md comes first. A link to a file outside the folder, a folder and a binary file give no part. A long file is cut at the last line end before the limit, and the part keeps the size. section gives nothing for no part, and else each file between its lines and the note of a cut."

