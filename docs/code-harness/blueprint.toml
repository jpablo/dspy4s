# ── Phase 9: the laws ─────────────────────────────────────────────────────────────────────────────────────────────

[[group]]
id = "release-laws"
phase = "p9"
module = "harness-kernel"
file = "ReleaseLaws.scala"
where = "tests"
title = "The laws of the release plans"

[[node]]
id = "law-release"
group = "release-laws"
kind = "law"
name = "Release:"
ref = "8.7"
uses = ["release-plan", "irreversible", "decide", "needs-flush", "entry"]
text = "A worktree with changes is never removed. A branch that is not merged gets a KeepRef of its head before its delete. Parked keeps each resource, and a folder of the user stays. Each item of a default plan is reversible. A plan names only its scope. A worktree goes before its branch. Released commits only with no open turn and before Ended."

[[group]]
id = "ledger-laws"
phase = "p9"
module = "harness-kernel"
file = "LedgerLaws.scala"
where = "tests"
title = "The laws of the ledger"

[[node]]
id = "law-ledger"
group = "ledger-laws"
kind = "law"
name = "Ledger:"
ref = "8.7"
uses = ["ledger-fold"]
text = "A read adds its path once. A write or an edit with a value or Unknown adds its path. exec and spawn count. ScopeRecorded and Released change the ledger. The ledger of a prefix is a prefix, and another entry changes nothing."

[[group]]
id = "controller-laws"
phase = "p9"
module = "harness-host"
file = "ControllerLaws.scala"
where = "tests"
title = "The laws of the controller and of the handler of Sessions"

[[node]]
id = "law-controller"
group = "controller-laws"
kind = "law"
name = "Controller:"
ref = "8.7"
uses = ["controller", "local-host", "work-runtime", "host-sessions"]
text = "The configuration of the controller, its task and its sources. Its API reference names Sessions and not write, edit, exec or rlm. A cell of the controller starts a session whose first entries are Activated and its task. zoomInto reads the memory of another session with no LM call."

[[node]]
id = "law-sessions"
group = "controller-laws"
kind = "law"
name = "Sessions:"
ref = "8.7"
uses = ["host-sessions", "peers", "probe", "recorded"]
text = "With fake peers: list gives the other cards, tell runs a Send with the request id of its effect and refuses a session that has ended, start makes the scope and opens the session once, zoom and observe give the text of the host and of the probe, and requestOf gives two ids for two effects."

[[group]]
id = "report-pass-laws"
phase = "p9"
module = "harness-host"
file = "ReportPassLaws.scala"
where = "tests"
title = "The laws of the report pass of a host"

[[node]]
id = "law-report-pass"
group = "report-pass-laws"
kind = "law"
name = "Report pass:"
ref = "8.7"
uses = ["report-pass", "local-host"]
text = "After a turn of a session whose owner is open, the owner commits the report and starts a turn. A turn of the person alone gives no report. An owner that was not open, or that ended, gets the report when it opens, once. At the start of a host, an owned session with an open turn gets TurnEnded(Crashed)."

[[group]]
id = "scopes-laws"
phase = "p9"
module = "harness-host"
file = "ScopesLaws.scala"
where = "tests"
title = "The laws of the scopes and of the release of a session"

[[node]]
id = "law-scopes"
group = "scopes-laws"
kind = "law"
name = "Scopes:"
ref = "8.7"
uses = ["git-scopes"]
text = "With the git of the machine: make of a worktree and of a scratch directory, snapshot of a git folder and none with no git, merged of a worktree, and the release of each item. A step that fails gives Failed."

[[node]]
id = "law-host-release"
group = "scopes-laws"
kind = "law"
name = "Host release:"
ref = "8.7"
uses = ["local-host", "release-plan", "irreversible"]
text = "release commits one Released for each step and then Ended, and the row holds the steps. An irreversible item runs only with a confirmation. A release during a turn runs no step."

[[group]]
id = "probe-laws"
phase = "p9"
module = "harness-host"
file = "ProbeLaws.scala"
where = "tests"
title = "The laws of a probe"

[[node]]
id = "law-probe"
group = "probe-laws"
kind = "law"
name = "Probe:"
ref = "8.7"
uses = ["harness-probe"]
text = "journalText has one line for each entry. pathOf names the caller and the effect. A probe has only Llm^, answers with submit, writes its journal and spends from the budget of the caller. A spent budget makes no call."

[[group]]
