# ── Phase 3: the laws ───────────────────────────────────────────────────────────────────────────────────────────

[[group]]
id = "profile-laws"
phase = "p3"
module = "harness-sandbox"
file = "ProfileLaws.scala"
where = "tests"
title = "The laws of the profile, as properties"

[[node]]
id = "law-profile-monotone"
group = "profile-laws"
kind = "law"
name = "Monotone:"
ref = "5.4"
uses = ["profile-for-mode"]
text = "If m1 <= m2, the profile of m2 allows each run, read, write and host that the profile of m1 allows. A profile that hides more paths allows less, and nothing under them."

[[node]]
id = "law-profile-authority"
group = "profile-laws"
kind = "law"
name = "Authority:"
ref = "5.4"
uses = ["profile-for-mode", "profile-for-command"]
text = "The profile of a mode allows a child process only with Shell^ and Files^, a write only under the scope or the private temporary directory and never in .git, a host only with Network^ and on the list, and in no mode a read or a write of a secret or of the journals. The profile of a command also hides each file with a secret name that exists in a writable root, apart from .git."

[[node]]
id = "law-secret-index"
group = "profile-laws"
kind = "law"
name = "Index:"
ref = "5.4"
uses = ["secret-index", "profile-for-mode"]
text = "After each change of the files, the index gives the secret files of a new walk. A folder that changed in the last two seconds is listed again, also with the same time, and a folder that the index cannot read is hidden as a whole."

[[node]]
id = "law-host-list"
group = "profile-laws"
kind = "law"
name = "Hosts:"
ref = "5.4"
uses = ["host-list"]
text = "A host is allowed when a pattern names it, with no case. *.d matches each subdomain of d and not d. An empty list allows no host."

[[group]]
id = "environment-laws"
phase = "p3"
module = "harness-sandbox"
file = "EnvironmentLaws.scala"
where = "tests"
title = "The laws of the allowlist of variables"

[[node]]
id = "law-env"
group = "environment-laws"
kind = "law"
name = "Environment:"
ref = "5.6"
uses = ["child-env"]
text = "A command gets only the names of the allowlist and of the session that the harness process has, with their values, and never a name with a secret word. GIT_AUTHOR_NAME, GIT_AUTHOR_EMAIL and GIT_AUTHOR_DATE are not secret. More names of the session never remove a name, and a second filter changes nothing."

[[group]]
id = "seatbelt-laws"
phase = "p3"
module = "harness-sandbox"
file = "SeatbeltLaws.scala"
where = "tests"
title = "The escape tests on macOS"

[[node]]
id = "law-seatbelt"
group = "seatbelt-laws"
kind = "law"
name = "Seatbelt:"
ref = "5.4"
uses = ["seatbelt", "profile-for-mode"]
text = "On macOS, for the profile of each mode of 5.2, a real child process can do what the probes of the profile allow and nothing more: writes in the scope, in the temporary directory, outside and in .git; reads of a secret, a .env file, a secret file with a quote in its name and the journals; a new file with a secret name; a hard link to a secret and to a .env file; a move of a .env file; a UNIX socket of the host; a child of the child; the network, directly and through the proxy; the processes outside the sandbox and launchd. When the backend works, a command runs under the profile of each mode with a child process."

[[group]]
id = "bubblewrap-laws"
phase = "p3"
module = "harness-sandbox"
file = "BubblewrapLaws.scala"
where = "tests"
title = "The escape tests on Linux"

[[node]]
id = "law-bubblewrap"
group = "bubblewrap-laws"
kind = "law"
name = "Bubblewrap:"
ref = "5.4"
uses = ["bubblewrap", "profile-for-mode"]
text = "On Linux with bwrap, the probes of Seatbelt give what the profile allows, apart from the network of Network^, which stays closed. The tests skip on a host with no working bwrap. scripts/sandbox-linux/run.sh runs them in a podman container, and the blueprint reads its report."

[[group]]
id = "seccomp-laws"
phase = "p3"
module = "harness-sandbox"
file = "SeccompLaws.scala"
where = "tests"
title = "The laws of the seccomp filter, on a model of classic BPF"

[[node]]
id = "law-seccomp"
group = "seccomp-laws"
kind = "law"
name = "Seccomp:"
ref = "5.4"
uses = ["seccomp"]
text = "On a model of classic BPF: socket for AF_UNIX, socketpair for SOCK_DGRAM and io_uring_setup get EPERM, the other calls are allowed, each call of another ABI gets EPERM, and another arch has no program. The escape tests run the real filter on Linux."

[[group]]
id = "proxy-laws"
phase = "p3"
module = "harness-sandbox"
file = "ProxyLaws.scala"
where = "tests"
title = "The laws of the proxy"

[[node]]
id = "law-proxy"
group = "proxy-laws"
kind = "law"
name = "Proxy:"
ref = "5.4"
uses = ["host-proxy"]
text = "A plain request and a CONNECT for a host on the list reach the host. A request for another host or port gets 403, and the proxy opens no connection for it. The Host header comes from the URL. A connection above the limit gets 503, a silent host ends at the idle time, and a download goes on while the client is silent."

[[group]]
id = "shell-laws"
phase = "p3"
module = "harness-sandbox"
file = "SandboxedShellLaws.scala"
where = "tests"
title = "exec runs only in a sandbox"

[[node]]
id = "law-exec"
group = "shell-laws"
kind = "law"
name = "Exec:"
ref = "5.3"
uses = ["sandboxed-shell"]
proof_uses = ["backend-detect"]
text = "With no backend, or in a mode with no child process, exec fails and the command does not run. Else the command runs in the sandbox of the mode: it sees only the variables of the allowlist, it cannot write outside the scope, also from its own child, and the time limit stops it and its children. A zombie counts as stopped, so the handler does not wait for it. A file with a secret name that a command makes is hidden from the next command."

