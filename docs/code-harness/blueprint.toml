kind = "law"
name = "Begin:"
ref = "8.7"
uses = ["decide", "source-of", "reports"]
text = "On a journal with no entry, Begin gives Activated, the task and TurnStarted, and NotNew on each other journal. Activated gets the source Harness, and the task the source of the sender, so reports sees a message of the owner."

[[node]]
id = "law-releasing"
group = "control-laws"
kind = "law"
name = "Releasing:"
ref = "8.7"
uses = ["decide", "evolve", "needs-flush"]
text = "Releasing commits only with no open turn, before Ended and once, and flushes. After it, Send and Grant give Rejection.Releasing, Released, StopJobs and Close stay valid, a Released needs it, and Activate starts no turn."

[[node]]
id = "law-unattended"
group = "control-laws"
kind = "law"
name = "Unattended:"
ref = "8.7"
uses = ["decide", "evolve"]
text = "A turn that no person starts counts, and a message of the person or a grant sets the count to 0. At the limit, a message of another session waits, a message of the person starts the turn, and Activate starts none."

[[node]]
id = "law-id"
group = "control-laws"
kind = "law"
name = "Id:"
ref = "8.7"
uses = ["session-id"]
text = "valid takes a letter or a digit, then letters, digits, a dot, an underscore or a dash, at most 128 characters, and refuses a path, a space, two dots and each other text."

[[node]]
id = "law-rejection-words"
