text = "Files.local reads and writes only under the root, also through a symbolic link, keeps .git read-only, and hides the secret files that exist. It refuses a link to a place that does not exist and a file with a second hard link. edit replaces the one place of a text."

[[node]]
id = "law-snapshot-store"
