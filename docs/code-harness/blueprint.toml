kind = "law"
name = "Store:"
ref = "4.7"
uses = ["snapshot-store"]
text = "The law Store for the handler: load reads the snapshot and the writes of the cell, the writes are only in the buffer, and a value comes back with the type of the cell that loads it."

[[node]]
id = "law-journal-turn"
group = "handler-laws"
kind = "law"
name = "Turn:"
ref = "5.1"
uses = ["journal-turn", "memory-journal"]
text = "input reads the values of the Input entries, and now reads the clock."

[[group]]
id = "window-laws"
phase = "p4"
module = "harness"
file = "WindowLaws.scala"
where = "tests"
title = "The laws of the window strategy and of the status"

[[node]]
id = "law-window"
group = "window-laws"
kind = "law"
name = "Window:"
ref = "7"
uses = ["window"]
text = "project depends only on the entries and the derived data, fits the budget, keeps the last observation and the newest steps, oldest first, keeps the last step also with a long text and code, gives each message an empty reasoning, and cuts a long value with a note. update gives no derived data."

[[node]]
id = "law-status"
group = "window-laws"
kind = "law"
name = "Status:"
ref = "7"
uses = ["status"]
text = "The status gives the step, the step limit and the keys of the store."

[[group]]
id = "harness-laws"
phase = "p4"
module = "harness"
file = "HarnessLaws.scala"
where = "tests"
title = "The laws of a harness, with a scripted model and a real REPL"

[[node]]
id = "law-harness"
group = "harness-laws"
kind = "law"
name = "Harness:"
ref = "9"
uses = ["harness"]
text = "A policy that submits gives the output through Data, and in RawPrediction.values. A reply with no code and the step limit run the finisher. The call works in a copy of the workspace, exec runs in the sandbox, and a failed model call gives a DspyError. The store keeps only the writes of a cell that completed. A code of null or None is no code. The task of the policy shows the preamble, and the reasoning of a reply, native or written, goes into the Acted. After the heap guard closes the REPL, the turn stops. The policy sees the hint of a compile error and the note of a timeout. After a cell that confuses the compiler, a new REPL runs the next cells, and the policy learns the lost names; another compile error starts no new REPL. A full REPL leads to a new REPL, and the hint of a compile error stays in the observation after the cut. A workspace that cannot be copied gives a DspyError and leaves no copy, and the copy leaves out a named pipe. The journal of a call is one turn, and it holds no known secret. The REPL has only the givens of the task mode. callPolicy gives its progress the size of its projection and the budget."

[[group]]
id = "structure-laws"
phase = "p4"
module = "harness"
file = "StructureLaws.scala"
where = "tests"
title = "The laws of the structure, and what the optimizers need"

[[node]]
id = "law-structure"
group = "structure-laws"
kind = "law"
name = "Structure:"
ref = "9"
uses = ["harness-structure", "harness"]
text = "The leaves are the policy, the finisher and the subQuery, with distinct keys, and the subQuery leaf has its first instructions. A replace with the parameters that read gives changes no parameter, a replace changes only the instructions of the three leaves, and the arity agrees with the leaves."

[[node]]
id = "law-optimizers"
group = "structure-laws"
kind = "law"
name = "Optimizers:"
ref = "9"
uses = ["harness-structure", "harness-runner", "harness"]
text = "A harness has what each optimizer needs, P: {OptimizableStructure, ProgramRunner}, and the runner reads a record of the inputs and gives the output in RawPrediction.values."

[[group]]
id = "harness-mutants"
