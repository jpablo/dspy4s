ref = "8.2"
spec = true
uses = []
text = "The model calls of one program call, for the whole tree: each policy call of the call and of each child, and each query. The finisher does not count. spend is one atomic step, because a batch runs on several threads. A proposal: the limit is 60."

[[node]]
id = "host-threads"
group = "budget"
kind = "data"
name = "HostThreads"
ops = ["run", "join"]
ref = "9"
uses = ["runtime-context"]
text = "The work of a program call on another thread: a query on the thread of its cell, a child on the thread of the cell of its parent, and a batch on host threads. run gives the body the context of the call and keeps its trace. A proposal: join adds the kept trace to the trace of the call after each cell, so an optimizer sees each call of a leaf."

[[node]]
id = "in-batch"
group = "budget"
kind = "function"
name = "inBatch"
ref = "6"
uses = []
text = "Runs a task for each item, at most width items at the same time, each on a host thread, and keeps the order of the items: all the values, or the first failure with the index of its item. After a failure, an item that did not start does not run."

