phase = "p9"
module = "harness-cli"
file = "DeskLaws.scala"
where = "tests"
title = "The laws of a client with a desk"

[[node]]
id = "law-desk"
group = "desk-laws"
kind = "law"
name = "Desk:"
ref = "8.7"
uses = ["desk", "card-text", "plan-text", "cli", "parse-line", "cli-args"]
text = "The lines /close OUTCOME, /sessions, /open ID and /controller, and the flag --controller. With no desk, a desk line prints that the client has one session. With a desk, the client switches between the sessions, and /close shows the plan and asks for each irreversible item."

