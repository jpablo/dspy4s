text = "After a power loss, the journal is a prefix that ends at the last flush. Each effect that changed the world has its intent in it, and so does each Input for which a sender got an answer. Phase 1 cuts the journal at the last flush; a real power loss is not in phase 1."

[[node]]
id = "law-job"
group = "effect-laws"
kind = "law"
name = "Job:"
ref = "4.7"
spec = true
uses = ["decide", "state", "forked", "schedules"]
text = "An Abort changes no job. A stop covers only the jobs with an intent before it. After Abort and then StopJobs(OfLastTurn), no job of that turn starts or runs. Ended stops all jobs, and a journal fork starts with no jobs. Phase 1 has the job table as a small value, with no process."

[[group]]
id = "approval-laws"
phase = "p1"
module = "harness-kernel"
file = "ApprovalLaws.scala"
where = "tests"
title = "The laws of grants and pending calls"

[[node]]
id = "law-grant"
group = "approval-laws"
kind = "law"
name = "Grant:"
ref = "4.7"
spec = true
uses = ["guard-check", "decide", "state", "forked", "schedules"]
text = "A Once grant covers one call. A Turn grant ends at the next TurnEnded. No grant stays after Ended, and a journal fork starts with no grants. A repeat of a Grant commits nothing."

[[node]]
id = "law-pending"
group = "approval-laws"
kind = "law"
name = "Pending call:"
ref = "4.7"
spec = true
uses = ["guard-check", "state", "forked", "goal-check-due", "schedules", "guard-rule", "owner"]
text = "A pending call has no active grant that covers it. TurnStarted and Ended empty pending, and a journal fork starts with no pending calls. A session with no person never gets a pending call."

[[node]]
id = "law-guard"
group = "approval-laws"
kind = "law"
name = "Guard:"
ref = "4.7"
spec = true
uses = ["guard", "guard-check", "schedules", "verdict"]
text = "verdict is a homomorphism from Guard to Verdict. A grant changes only Ask, and more grants never make a result stronger."

[[group]]
id = "report-laws"
phase = "p1"
module = "harness-kernel"
file = "ReportLaws.scala"
where = "tests"
title = "The law of reports"

[[node]]
id = "law-report"
group = "report-laws"
kind = "law"
name = "Report:"
ref = "4.7"
spec = true
uses = ["reports", "missing", "state", "schedules"]
text = "After the report pass of 8.6, each TurnEnded or Ended that needs a report has exactly one Input in the journal of an open owner. Phase 1 checks only reports and missing; the report pass of a real host comes later."

