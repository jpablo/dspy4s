# The mutants of the exchange file of a session and of the reads of the inspector. Each mutant breaks one rule of 4.2,
# 4.3, 4.4 or 5.1 of docs/code-harness/OBSERVABILITY.md, and the laws of its section 6 must kill it.
#
# `python3 scripts/mutants/mutants.py modules/harness-host/src/test/mutants.toml` applies each mutant alone, runs the
# suites of `tests`, and restores the code. The whole suite of the host takes minutes, so `tests` names only the laws of
# the exchange file, of the journal file, of the scopes, of the jobs, of the controller, of the goal loop, of the close
# of a session and of a work session. The mutants of the scopes break a rule of choice 19 (5.4) of
# docs/code-harness/CODE_HARNESS_DESIGN.md: the clone of a Worktree scope and the publish of its branch. The mutants of
# the jobs break a rule of the end of a job in the journal (10.3 of the same file). The mutants of `tell` break the rule
# of its value: a message that waits for the person (8.7 of the same file). The mutants of the goal loop break a rule of
# 8.5 of the same file, and the laws of GoalHostLaws kill them. The mutants of the close of a session break the rule of
# 10.2 that the close is a crash for the open turn, and the laws of GoalHostLaws and CloseLaws kill them. The mutants of
# the task of a work session break the rule that the task tells how the person answers an approval only when a rule of
# the guard can ask (10.6 of the same file), and the laws of WorkLaws kill them.

module = "harness-host"
project = "harnessHost"
sources = "modules/harness-host/src/main/scala/dspy4s/harness/host"
tests = "dspy4s.harness.host.ExchangeFileLaws dspy4s.harness.host.SessionFileLaws dspy4s.harness.host.ScopesLaws dspy4s.harness.host.JobLaws dspy4s.harness.host.ControllerLaws dspy4s.harness.host.GoalHostLaws dspy4s.harness.host.CloseLaws dspy4s.harness.host.WorkLaws"

