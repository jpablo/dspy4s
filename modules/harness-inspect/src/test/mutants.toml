# ── The colors of the views (5.3, law L18) ──

[[mutant]]
name = "Mutant: a JSON string before a colon is a string, not a key"
[[mutant.edit]]
file = "Highlight.scala"
old = "(if next(text, stop).contains(':') then Tint.Key else Tint.Str, stop)"
new = "(if next(text, stop).contains(',') then Tint.Key else Tint.Str, stop)"

[[mutant]]
name = "Mutant: a backslash in a literal does not take the next character"
[[mutant.edit]]
file = "Highlight.scala"
old = '''while j < text.length && text(j) != quote do j += (if text(j) == '\\' then 2 else 1)'''
new = '''while j < text.length && text(j) != quote do j += (if text(j) == '\u0000' then 2 else 1)'''

[[mutant]]
name = "Mutant: a block ends at the first three quotes"
[[mutant.edit]]
file = "Highlight.scala"
old = '''if close < 0 then text.length else span(text, close + 3, _ == '"')'''
new = '''if close < 0 then text.length else close + 3'''

[[mutant]]
name = "Mutant: the sign of an exponent ends a number"
[[mutant.edit]]
file = "Highlight.scala"
old = '''("+-".contains(text(j)) && "eE".contains(text(j - 1)))'''
new = '''("+".contains(text(j)) && "eE".contains(text(j - 1)))'''

[[mutant]]
name = "Mutant: a name before = is not a field"
[[mutant.edit]]
file = "Highlight.scala"
old = "j >= 0 && text(j) == '='"
new = "j >= 0 && text(j) == ':'"

[[mutant]]
name = "Mutant: a name with a capital letter is plain"
[[mutant.edit]]
file = "Highlight.scala"
old = "else if word.head.isUpper then Tint.Type"
new = "else if word.head.isDigit then Tint.Type"

[[mutant]]
name = "Mutant: the class of a color has another name"
[[mutant.edit]]
file = "Highlight.scala"
old = '<span class="t-${tint.toString.toLowerCase}">'
new = '<span class="c-${tint.toString.toLowerCase}">'

[[mutant]]
name = "Mutant: a piece with a color has no escape"
[[mutant.edit]]
file = "Highlight.scala"
old = '<span class="t-${tint.toString.toLowerCase}">${escape(t.text)}</span>'
new = '<span class="t-${tint.toString.toLowerCase}">${t.text}</span>'

