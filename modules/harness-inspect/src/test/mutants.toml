# The mutants of the inspector. Each mutant breaks one rule of section 5 of docs/code-harness/OBSERVABILITY.md, and
# laws L10 to L17 of its section 6 must kill it.
#
# `python3 scripts/mutants/mutants.py modules/harness-inspect/src/test/mutants.toml` applies each mutant alone, runs the
# tests of the module, and restores the code. At least one test must fail for each mutant.

module = "harness-inspect"
project = "harnessInspect"
sources = "modules/harness-inspect/src/main/scala/dspy4s/harness/inspect"

# ── The server (5.1) ──

[[mutant]]
name = "Mutant: a request with any Host header gets data"
[[mutant.edit]]
file = "Inspector.scala"
old = """if !host.exists(h => h == s"127.0.0.1:$port" || h == s"localhost:$port") then"""
new = """if !host.exists(h => h.nonEmpty || h == s"localhost:$port") then"""

[[mutant]]
name = "Mutant: a POST gets data"
[[mutant.edit]]
file = "Inspector.scala"
old = """else if method != "GET" then"""
new = """else if method == "PUT" then"""

[[mutant]]
name = "Mutant: the policy of a page lets each inline script run"
[[mutant.edit]]
file = "Inspector.scala"
old = "script-src 'nonce-$nonce';"
new = "script-src 'unsafe-inline';"

[[mutant]]
name = "Mutant: the store opens a journal to write it"
[[mutant.edit]]
file = "Store.scala"
old = "SessionFile.readOnly(path, session).flatMap { file =>"
new = "SessionFile.open(path, session).flatMap { file =>"

[[mutant]]
name = "Mutant: the store opens the catalog to write it"
[[mutant.edit]]
file = "Store.scala"
old = "Catalog.readOnly(Catalog.pathOf(root)).toOption.fold("
new = "Catalog.open(Catalog.pathOf(root)).toOption.fold("
[[mutant.edit]]
file = "Store.scala"
old = "Catalog.readOnly(Catalog.pathOf(root)).toOption.flatMap"
new = "Catalog.open(Catalog.pathOf(root)).toOption.flatMap"

# ── The pages (5.2) ──

[[mutant]]
name = "Mutant: after/{seq} gives the row of seq again"
[[mutant.edit]]
file = "Pages.scala"
old = "store.rows(session, seq + 1).map { rows =>"
new = "store.rows(session, seq).map { rows =>"

[[mutant]]
name = "Mutant: an exchange goes after the entry before its after"
[[mutant.edit]]
file = "Pages.scala"
old = "seqs.filter(_ <= x.after).lastOption"
new = "seqs.filter(_ < x.after).lastOption"

# ── The views (5.3) ──

[[mutant]]
name = "Mutant: the JSON view is not the text of the file"
[[mutant.edit]]
file = "EntryViews.scala"
old = "_.print(WriterConfig.withIndentionStep(2)))"
new = """_.print(WriterConfig.withIndentionStep(2)).replace("\\"seq\\"", "\\"seq0\\""))"""

[[mutant]]
name = "Mutant: the Scala view on one line has no field names"
[[mutant.edit]]
file = "ScalaText.scala"
old = """flat(v).map(text => s"$name = $text")"""
new = """flat(v).map(text => s"${name.take(0)}$text")"""

[[mutant]]
name = "Mutant: a backslash in a Scala literal is not escaped"
[[mutant.edit]]
file = "ScalaText.scala"
old = '''case '\\'                                      => "\\\\"'''
new = '''case '\\'                                      => "\\"'''

[[mutant]]
name = "Mutant: the escape keeps a <"
[[mutant.edit]]
file = "Html.scala"
old = """case '<'   => out ++= "&lt;""""
new = """case '<'   => out ++= "<""""

[[mutant]]
name = "Mutant: a paragraph of a card has no escape"
[[mutant.edit]]
file = "EntryViews.scala"
old = """private def paragraph(text: String): String = s"<p>${escape(text)}</p>""""
new = """private def paragraph(text: String): String = s"<p>$text</p>""""

# ── The page of an exchange (5.4) ──

[[mutant]]
name = "Mutant: the table of the diff counts no common line"
[[mutant.edit]]
file = "LineDiff.scala"
old = "if a(i) == b(j) then table((i + 1) * width + j + 1) + 1"
new = "if a(i) == b(j) then table((i + 1) * width + j + 1)"

[[mutant]]
name = "Mutant: the common end of the two texts is added, not kept"
[[mutant.edit]]
file = "LineDiff.scala"
old = "a.takeRight(end).map(Edit.Keep(_))"
new = "a.takeRight(end).map(Edit.Add(_))"

[[mutant]]
name = "Mutant: a hunk starts one kept line too early"
[[mutant.edit]]
file = "LineDiff.scala"
old = "val from   = (group.head - context).max(0)"
new = "val from   = (group.head - context - 1).max(0)"

[[mutant]]
name = "Mutant: the chat view reads no stream"
[[mutant.edit]]
file = "Chat.scala"
old = "if x.stream then streamed(mode, model.stream(request))"
new = "if x.stream then streamed(mode, Iterator.empty)"

[[mutant]]
name = "Mutant: the text of a request has no line with the role"
[[mutant.edit]]
file = "Chat.scala"
old = 'Vector(s"── $role ──") ++ contentOf(json)'
new = 'Vector(s"$role") ++ contentOf(json)'

[[mutant]]
name = "Mutant: the diff is against the last earlier exchange of any predictor"
[[mutant.edit]]
file = "ExchangePage.scala"
old = "exchanges.filter(e => e.index < x.index && e.predictor == x.predictor).lastOption"
new = "exchanges.filter(e => e.index < x.index && e.predictor.nonEmpty).lastOption"

[[mutant]]
name = "Mutant: the copy of the request is the body with indents"
[[mutant.edit]]
file = "ExchangePage.scala"
old = '<pre id="request-exact" hidden>${escape(x.body)}</pre>'
new = '<pre id="request-exact" hidden>${escape(pretty(x.body))}</pre>'

# ── The raw paths in a browser (5.5, law L17) ──

[[mutant]]
name = "Mutant: the exchange file goes as NDJSON, so a browser saves it and does not show it"
[[mutant.edit]]
file = "Inspector.scala"
old = 'else Reply(200, "text/plain", Files.readString(path, UTF_8))'
new = 'else Reply(200, "application/x-ndjson", Files.readString(path, UTF_8))'

[[mutant]]
name = "Mutant: the rows of the journal go as NDJSON"
[[mutant.edit]]
file = "Inspector.scala"
old = 'Reply(200, "text/plain", lines.map(_ + "\n").mkString)'
new = 'Reply(200, "application/x-ndjson", lines.map(_ + "\n").mkString)'

[[mutant]]
name = "Mutant: download=1 gives no name to save"
[[mutant.edit]]
file = "Inspector.scala"
old = 'if reply.status == 200 && query(uri).get("download").contains("1") then'
new = 'if reply.status == 200 && query(uri).get("download").contains("yes") then'

[[mutant]]
name = "Mutant: each raw path is a download"
[[mutant.edit]]
file = "Inspector.scala"
old = 'if reply.status == 200 && query(uri).get("download").contains("1") then'
new = 'if reply.status == 200 && query(uri).get("download").forall(_.nonEmpty) then'

[[mutant]]
name = "Mutant: the name to save keeps each character of the exchange id"
[[mutant.edit]]
file = "Inspector.scala"
old = '''if c.isLetterOrDigit && c < 128 || "-_.".contains(c) then c else '_''''
new = '''if c.isLetterOrDigit || "-_.;%".contains(c) then c else '_''''

[[mutant]]
name = "Mutant: the download links show the raw paths"
[[mutant.edit]]
file = "Html.scala"
old = '<span class="group">Download: ${links("?download=1")}</span>'
new = '<span class="group">Download: ${links("")}</span>'
