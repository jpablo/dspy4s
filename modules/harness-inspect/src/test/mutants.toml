name = "Mutant: a request with any Host header gets data"
[[mutant.edit]]
file = "Inspector.scala"
old = """if !host.exists(h => h == s"127.0.0.1:$port" || h == s"localhost:$port") then"""
new = """if !host.exists(h => h.nonEmpty || h == s"localhost:$port") then"""

[[mutant]]
name = "Mutant: a POST gets data"
[[mutant.edit]]
file = "Inspector.scala"
old = """else if method != "GET" then"""
new = """else if method == "PUT" then"""

[[mutant]]
name = "Mutant: the policy of a page lets each inline script run"
[[mutant.edit]]
file = "Inspector.scala"
old = "script-src 'nonce-$nonce';"
new = "script-src 'unsafe-inline';"

[[mutant]]
name = "Mutant: the store opens a journal to write it"
[[mutant.edit]]
file = "Store.scala"
old = "SessionFile.readOnly(path, session).flatMap { file =>"
new = "SessionFile.open(path, session).flatMap { file =>"

