# The mutants of the inspector. Each mutant breaks one rule of section 5 of docs/code-harness/OBSERVABILITY.md, and
# laws L10 to L19 of its section 6 must kill it.
#
# `python3 scripts/mutants/mutants.py modules/harness-inspect/src/test/mutants.toml` applies each mutant alone, runs the
# tests of the module, and restores the code. At least one test must fail for each mutant.

module = "harness-inspect"
project = "harnessInspect"
sources = "modules/harness-inspect/src/main/scala/dspy4s/harness/inspect"

# ── The server (5.1) ──

