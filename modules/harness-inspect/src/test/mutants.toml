new = """def json(row: SessionFile.Row): String = jsonOf(row).fold(row.text)(j => JsonText.pretty(j).replace("\\"text\\"", "\\"text0\\""))"""

[[mutant]]
name = "Mutant: the JSON view of a row shows the whole row"
[[mutant.edit]]
file = "EntryViews.scala"
old = '''else whole.fields.collectFirst { case ("entry", value) => value }.getOrElse(whole)'''
new = '''else whole.fields.collectFirst { case ("seq0", value) => value }.getOrElse(whole)'''

[[mutant]]
