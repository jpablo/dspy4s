new = "Catalog.open(Catalog.pathOf(root)).toOption.fold("
[[mutant.edit]]
file = "Store.scala"
old = "Catalog.readOnly(Catalog.pathOf(root)).toOption.flatMap"
new = "Catalog.open(Catalog.pathOf(root)).toOption.flatMap"

