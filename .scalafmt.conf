version = "3.11.5"
runner.dialect = scala3

# Restrict repository-wide formatting to version-controlled files.
project.git = true

maxColumn = 120
indent.main = 2

# Scala 3 significant-indentation codebase: retain authored syntax. These are
# Scalafmt 3.11.5 defaults, documented here rather than set as active overrides.
rewrite.scala3.convertToNewSyntax = true
rewrite.scala3.optionalBraces.enabled = true

# Scalafmt's broadest built-in alignment preset; extend it only for parameters.
align.preset = most
# Keep alignment local: comments and multiline statements split alignment groups.
align.multiline = false
# Align type colons and defaults in constructor and method parameters.
# Padding must precede `:` so the colon itself, rather than the type, aligns.
align.delayUntilSpace = false
align.tokens."+" = [
  {
    code = ":"
    owners = [
      { regex = "Term\\.Param", parents = ["Ctor\\.Primary"] },
      { regex = "Term\\.Param", parents = ["(Defn|Decl)\\.Def"] }
    ]
  },
  {
    code = "="
    owners = [
      { regex = "Term\\.Param", parents = ["Ctor\\.Primary"] },
      { regex = "Term\\.Param", parents = ["(Defn|Decl)\\.Def"] },
      { regex = "(Enumerator\\.Val|Defn\\.(Va(l|r)|GivenAlias|Def|Type))" }
    ]
  }
]

danglingParentheses.preset = true
# Preserve deliberate line breaks, including multiline Scala 3 `if` branches,
# without unfolding compact match cases.
newlines.source = keep
# Fold short case bodies onto the `=>` line, but keep multiline method bodies
# below their assignment `=`.
newlines.beforeMultiline = fold
newlines.forceBeforeMultilineAssign = def

# scalameta (scalafmt's parser) mis-lexes a triple-quoted literal (`"""hi"}"""`) that the Scala 3 compiler accepts;
# exclude the file rather than alter the test's intent.
project.excludePaths = ["glob:**/JsonStreamingStateSuite.scala"]
