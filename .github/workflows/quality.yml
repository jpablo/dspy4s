name: Quality reports

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SBT_OPTS: "-Xmx6g -Xss8m -Dsbt.color=false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Statement and branch coverage
        run: sbt -batch coverageAll

      - name: Mutation report for the optic and program structure
        run: sbt -batch mutationOptics

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scoverage-reports
          path: "**/scoverage-report/**"
          if-no-files-found: warn
          retention-days: 30

      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker4s-reports
          path: "**/stryker4s-report/**"
          if-no-files-found: warn
          retention-days: 30
