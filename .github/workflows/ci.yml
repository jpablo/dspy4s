name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Check formatting
        run: sbt -batch fmtCheck

      - name: Compile benchmarks
        run: sbt -batch benchmarks/Jmh/compile

      - name: Test benchmark tools
        run: |
          python3 -m unittest discover .github/bench -v
          python3 .github/bench/bench_tools.py validate-mapping

      # The Deno sandbox tests skip when deno is not on PATH. This Deno version is the version of the development
      # machine. The first sandbox start downloads Pyodide (16 MB, a few seconds), so the job has no Deno cache.
      - name: Install Deno
        uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: "2.7.4"

      - name: Run all tests
        run: sbt -batch test
